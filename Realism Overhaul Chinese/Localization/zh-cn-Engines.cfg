Localization
{
	zh-cn
	{
		//	============================================================================
		//	Engine Config Localizations
		//	============================================================================
		//#
		//		15D13
		#ro15D13Title = 15D13 液体火箭发动机
		#ro15D13Desc = 15D13 于 20 世纪 60 年代由 OKB-117 为 UR-100 导弹的上面级研制，是 OKB-117 最早研制的火箭发动机之一；为节省时间，其研制与 A-350Zh 反导导弹的 5D22 上面级发动机合并进行，还曾以 11D423 的名义作为 LK-700 着陆舱的制动发动机方案。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。用于 UR-100 的上面级，单台，燃烧约 184 秒。
		//		457M
		#ro457MTitle = 457M 72kW 霍尔效应推进器
		#ro457MDesc = 457M 于 2000 年开始研制，面向空间太阳能发电系统等高功率航天器，属于 50 kW 级霍尔效应推进器。燃料：氙（Xenon）。2002 年以 650 V 电压完成了功率高达 72 kW 的实验室样机点火试验。
		//A
		//		18KS7800
		#ro18KS7800Title = Aerojet 1.8KS-7800 固体火箭发动机
		#ro18KS7800Desc = Aerojet 1.8KS-7800 取自 AIM-7 麻雀（Sparrow）空空导弹，是小型固体发动机。燃料：改性双基推进剂（NGNC）。用作 Aerobee 300 与 300A 探空火箭的第三级，燃烧约 2 秒。
		//		25KS18000
		#ro25KS18000Title = Aerojet 2.5KS-18000 固体火箭发动机
		#ro25KS18000Desc = Aerojet 2.5KS-18000 于 20 世纪 40 年代末为 Aerobee 计划研制，是小型但强劲的固体发动机。燃料：改性双基推进剂（NGNC）。用作 Aerobee 系列探空火箭的第一级，燃烧约 2.5 秒。
		//A
		//		A-1
		#roA1Title = A-1 液体火箭发动机
		#roA1Desc = A-1 于 1946 年由通用电气（General Electric）为 Hermes 计划（CTV-G-5）的美国版 Wasserfall 导弹研制，是基础型挤压式发动机。燃料：液氧/75% 乙醇。虽然设计被认为不适合军事用途，仍发射了数枚 Hermes A-1 导弹，用于积累大型火箭的建造与操作经验，燃烧约 40 秒。
		//		A-3
		#roA3Title = A-3 液体火箭发动机
		#roA3Desc = A-3 由通用电气作为 Hermes A-1 的改进型研制，为 Hermes A-3 弹道导弹提供动力，是泵压式发动机。燃料：液氧/75% 乙醇。研制困难使计划分裂为两部分：较小的 A-3A 为较大的 A-3B 验证发动机与制导系统。它曾以 SSM-A-16 名义供美国陆军评估，但因性能与可靠性不佳被否决，燃烧约 70 秒。
		//		A-4
		#roA-4Title = Model 39 液体火箭发动机
		#roA-4Desc = Model 39 是蒂尔（Walter Thiel）设计的酒精/液氧起飞发动机，用于 A-4 B 系列/V-2 导弹。燃料：液氧/75% 乙醇。由于单一大型喷注器的燃烧不稳定问题无法解决，采用 18 个 1.5 吨推力室供入共同混合室；Model 39b 本是过渡设计却投入批量生产。1936 年开始研制，1939 年试车，1943–1945 年批量生产，燃烧约 70 秒。
		//		Aerobee
		#roAerobeeTitle = Aerobee 液体火箭发动机
		#roAerobeeDesc = Aerobee 主发动机于 20 世纪 40 年代后期由阿罗杰特（Aerojet）研制，是小型挤压式主发动机。燃料：抑制型红发烟硝酸（IRFNA）/苯胺-糠醇混合物（ANFA）。用于 WAC 下士（WAC Corporal）与 Aerobee 探空火箭，置于小型固体助推器之后，燃烧约 40–50 秒。
		//		Aestus
		#roAestusTitle = Aestus 液体火箭发动机
		#roAestusDesc = Aestus 于 20 世纪 90 年代由奥托布伦空间推进中心研制，是阿丽亚娜 5 的自燃推进剂上面级发动机。燃料：一甲基肼/四氧化二氮（MMH/MON3）。基线型采用挤压式输送，用于阿丽亚娜 5 G、GS 与 ES 型上面级，可多次点火，总燃烧时长约 1100 秒；Aestus II（即 RS-72）为泵压式改进型，综合性能更优，总燃烧时长约 2500 秒。
		//		Agena
		#roAgenaTitle = XLR81（Agena）真空发动机
		#roAgenaDesc = XLR81 于 20 世纪 50 年代为 B-58 盗贼（Hustler）轰炸机的防区外武器研制，是使用可储存自燃推进剂的燃气发生器循环发动机。燃料：偏二甲肼/红发烟硝酸（UDMH/IRFNA）。用作 Agena 上面级的主发动机，单台，燃烧约 120–265 秒（视型号而定）。Agena B 的 XLR81-BA-7（8081 型）首次实现再点火；Agena D 的 XLR81-BA-11（8096 型）采用沉底集液装置处理失重起动；双子座计划 Agena 目标飞行器所用的 XLR81-BA-13（8247 型）可再点火最多 14 次。
		//		AgenaSPS
		#roAgenaSPSTitle = Agena-D 辅助推进系统
		#roAgenaSPSDesc = Agena-D 辅助推进系统于 20 世纪 60 年代初为双子座计划的 Agena 目标飞行器研制，可在不启动主发动机的情况下完成精确控制与轨道机动，后作为 Agena 的升级选项提供给商业客户。燃料：偏二甲肼/四氧化二氮（UDMH/MON3）。整套系统自备推进剂贮箱、一台 16 磅推力室与一台 200 磅推力室，可多次点火，累计燃烧时长约 1000 秒。
		//		AJ10_137
		#roAJ10_137Title = AJ10-137（服务推进系统）
		#roAJ10_137Desc = AJ10-137 于 20 世纪 60 年代由阿罗杰特（Aerojet）研制，用作阿波罗指令/服务舱（CSM）的服务推进系统。燃料：四氧化二氮/混肼-50（MON1/Aerozine-50）。设计总燃烧时长约 750 秒，可再点火 50 次。
		//		AJ10_190
		#roAJ10_190Title = AJ10-190 液体火箭发动机
		#roAJ10_190Desc = AJ10-190 于 20 世纪 70 年代为航天飞机研制，是低推力挤压式自燃发动机。燃料：一甲基肼/四氧化二氮（MMH/MON3）。用于航天飞机的入轨、轨道机动与离轨，现用于猎户座（Orion）载人飞船。可多次点火，累计燃烧能力约 15 小时，单次连续最长约 1250 秒。
		//		AJ10_Adv
		#roAJ10_AdvTitle = AJ10 系列（先进型）液体火箭发动机
		#roAJ10_AdvDesc = AJ10 系列源自美国第一种液体火箭发动机，是寿命最长的发动机家族，从美国首枚卫星运载火箭先锋号（Vanguard）一直用到阿波罗服务舱，还曾计划用于猎户座服务舱。燃料：四氧化二氮/混肼-50（NTO/Aerozine-50）。先进型带延伸喷管与再点火能力，用于 Transtage 及德尔塔 F、德尔塔 K 上面级，累计燃烧时长约 500 秒，可多次点火。
		//		AJ10_Early
		#roAJ10_EarlyTitle = AJ10 系列（早期型）液体火箭发动机
		#roAJ10_EarlyDesc = AJ10 系列源自美国第一种液体火箭发动机，是寿命最长的发动机家族，从美国首枚卫星运载火箭先锋号一直用到阿波罗服务舱，还曾计划用于猎户座服务舱。燃料：发烟硝酸/偏二甲肼（IWFNA/UDMH）。早期型是最初的先锋号二子级/Able/德尔塔构型，无再点火能力，燃烧约 115–150 秒。
		//		AJ10_Mid
		#roAJ10_MidTitle = AJ10 系列（中期型）液体火箭发动机
		#roAJ10_MidDesc = AJ10 系列源自美国第一种液体火箭发动机，是寿命最长的发动机家族，从美国首枚卫星运载火箭先锋号一直用到阿波罗服务舱，还曾计划用于猎户座服务舱。燃料：红发烟硝酸/偏二甲肼（IRFNA/UDMH）。中期型带延伸喷管与再点火能力，用于雷神-阿布尔斯塔（Thor-Ablestar）及德尔塔 E 至德尔塔 N 上面级，可多次点火，累计燃烧时长约 300–400 秒。
		//		AJ10_Transtar
		#roAJ10_TranstarTitle = AJ23 Transtar 液体火箭发动机
		#roAJ10_TranstarDesc = AJ23 Transtar 于 20 世纪 80 年代研制，是 AJ10 的泵压式升级型号，定位为高性能上面级与空间拖船。它大量沿用航天飞机轨道机动系统（OMS）的喷管与燃烧室，以涡轮泵取代挤压式输送。燃料：一甲基肼/四氧化二氮（MMH/MON3）。挑战者号事故后项目取消，但 Transtar 1 曾作为泰坦四号（Titan IV）上的 Titan Launch Dispenser 飞行。
		//		AJ60A
		#roAJ60ATitle = AJ-60A 固体火箭助推器
		#roAJ60ADesc = AJ-60A 由阿罗杰特·洛克达因公司于 1999–2003 年研制，为联合发射联盟（ULA）的阿特拉斯五号提供起飞助推。燃料：端羟基聚丁二烯（HTPB）。按构型在芯级两侧捆绑 0–5 台（401–551 构型），燃烧约 94 秒后分离。
		//		AJ260FL
		#roAJ260FLTitle = AJ-260 FL 固体火箭发动机
		#roAJ260FLDesc = AJ-260 FL 于 20 世纪 60 年代由阿罗杰特为 NASA 研制，AJ-260 是有史以来试车过的最大固体火箭发动机，全长型方案满载总质量 1648 吨，提供 35,391 kN 的推力。它被设计为土星 IB 的替代方案以及阿波罗应用计划运载火箭的起飞助推级。燃料：聚丁二烯丙烯腈（PBAN），设计燃烧时长超过 2 分钟。
		#roAJ260FLSideTitle = AJ-260 FL 固体火箭助推器
		#roAJ260FLSideDesc = AJ-260 是有史以来试车过的最大固体火箭发动机，这是全长型方案，满载总质量 1648 吨，提供 35,391 kN 的推力，被设计为土星 IB 的替代方案以及阿波罗应用计划运载火箭的起飞助推级。燃料：聚丁二烯丙烯腈（PBAN）。本条目为用于捆绑安装的径向连接版本，设计燃烧时长超过 2 分钟。
		//		AJ260SL
		#roAJ260SLTitle = AJ-260 SL 固体火箭发动机
		#roAJ260SLDesc = AJ-260 SL 是 AJ-260 的短型版本，21.6 × 6.6 米的庞然大物，满载质量超过 842 吨，可提供超过 15,000 kN 的推力约 120 秒。燃料：聚丁二烯丙烯腈（PBAN）。项目最终被取消，但在取消前完成了三次试车，发动机性能完全符合规格。
		#roAJ260SLSideTitle = AJ-260 SL 固体火箭助推器
		#roAJ260SLSideDesc = AJ-260 SL 是 AJ-260 的短型版本，21.6 × 6.6 米的庞然大物，满载质量超过 842 吨，可提供超过 15,000 kN 的推力约 120 秒。燃料：聚丁二烯丙烯腈（PBAN）。项目最终被取消，但在取消前完成了三次试车，发动机性能完全符合规格。本条目为用于捆绑安装的径向连接版本。
		//		Alcyone1
		#roAlcyone1Title = Alcyone 1 BE-3 固体火箭发动机
		#roAlcyone1Desc = Alcyone 1 BE-3 于 20 世纪 60 年代初研制，是小型固体制动发动机，原为徘徊者（Ranger）2 型硬着陆舱的制动发动机。燃料：铝粉改性双基推进剂（NGNC）。由于徘徊者探测器接连失败，该硬着陆舱从未投入使用，燃烧约 12 秒。
		//		Alcyone1A
		#roAlcyone1ATitle = Alcyone 1A BE-3A 固体火箭发动机
		#roAlcyone1ADesc = Alcyone 1A BE-3A 是小型固体变轨发动机，作为侦察兵（Scout）运载火箭的第五级研制。燃料：复合固体推进剂。仅在用于发射探险者 52 号（Explorer 52）的 Scout E-1 上飞行过一次，最大推力 27.5 kN，燃烧约 9 秒。
		//		Algol-I
		#roAlgol-ITitle = Algol IB 固体火箭发动机
		#roAlgol-IDesc = Algol IB 于 20 世纪 50 年代末研制，是侦察兵（Scout）运载火箭的第一级固体发动机，用于早期的 X-1 与 X-2 型侦察兵。燃料：聚氨酯复合推进剂，燃烧约 41 秒。
		//		Algol-II
		#roAlgol-IITitle = Algol II 固体火箭发动机
		#roAlgol-IIDesc = Algol II 于 20 世纪 60 年代初由 Algol I 发展而来，用作侦察兵运载火箭的第一级固体发动机。燃料：聚氨酯类复合推进剂，燃烧约 80 秒。
		//		Algol-III
		#roAlgol-IIITitle = Algol III 固体火箭发动机
		#roAlgol-IIIDesc = Algol III 是侦察兵运载火箭第一级固体发动机的最终发展型。燃料：聚丁二烯丙烯腈（PBAN），燃烧约 70 秒。
		//		Altair
		#roAltairTitle = Altair X-248 固体火箭发动机
		#roAltairDesc = Altair X-248 于 20 世纪 50 年代末研制，是先锋号（Vanguard）第三级的备选方案，为小型固体变轨发动机。燃料：聚丁二烯丙烯酸（PBAA）。后被多型运载火箭与 Able/德尔塔上面级（即"Thor Burner"）搭配使用，在远地点圆化轨道或对有效载荷做末级加速，燃烧约 39 秒。
		//		Altair-II
		#roAltair-IITitle = Altair II X-258 固体火箭发动机
		#roAltair-IIDesc = Altair II X-258 由 Altair 发展而来，用于侦察兵与德尔塔运载火箭，在远地点圆化轨道或对有效载荷做末级加速。燃料：复合固体推进剂，平均推力 28.48 kN，燃烧约 22 秒。
		//		Altair-III
		#roAltair-IIITitle = Altair III FW-4S 固体火箭发动机
		#roAltair-IIIDesc = Altair III FW-4S 是 Altair 的最终版本，用于后期的侦察兵 B 运载火箭，在远地点圆化轨道或对有效载荷做末级加速。燃料：复合固体推进剂，最大推力 25.6 kN，燃烧约 31 秒。
		//		AMBR
		#roAMBRTitle = AMBR 液体火箭发动机
		#roAMBRDesc = AMBR（先进材料双组元火箭发动机）于 21 世纪初由阿罗杰特为 NASA 研制，是高性能、高推力、辐射冷却的可储存双组元空间发动机，外形包络与高性能远地点推力器（HiPAT）相同。燃料：肼/四氧化二氮（Hydrazine/MON3）。可节流，总燃烧时长约 2700 秒。
		//		Antares-I
		#roAntares-ITitle = Antares I X-254 固体火箭发动机
		#roAntares-IDesc = Antares I X-254 用作侦察兵运载火箭的第三级固体发动机。燃料：聚丁二烯丙烯酸（PBAA），燃烧约 38 秒。
		//		Antares-II
		#roAntares-IITitle = Antares IIA X-259 固体火箭发动机
		#roAntares-IIDesc = Antares IIA X-259 用作侦察兵运载火箭绝大多数发射任务的第三级固体发动机。燃料：聚丁二烯丙烯酸（PBAA），燃烧约 34 秒。
		//		AR1
		#roAR1Title = AR-1 液体火箭发动机
		#roAR1Desc = AR-1 于 2010 年代由阿罗杰特·洛克达因提出研制，是 2200 kN 级富氧分级燃烧液氧煤油发动机，原计划以两台替代阿特拉斯五号上的俄制 RD-180。燃料：液氧/煤油（RP-1）。由于阿罗杰特·洛克达因不愿出资完成研制，开发被中止，燃烧约 450 秒。
		//		AR2
		#roAR2Title = AR-1/2 液体火箭发动机
		#roAR2Desc = AR-1/2 于 20 世纪 50 年代由洛克达因（Rocketdyne）研制，是小型液体火箭助推发动机，用于提升 FJ-4/F-86 的性能。燃料：90% 过氧化氢/JP-4 航空煤油。系统虽经大量试验，但重量抵消了性能增益；后期升级为泵压式，可直接使用飞机燃料箱中的燃料，用于 NF-104A 宇航员训练机，燃烧约 180 秒。
		//		ASRB
		#roASRBTitle = 先进固体火箭助推器
		#roASRBDesc = 先进助推器（Advanced Booster）于 2010 年代提出，是为太空发射系统（SLS）研制的复合壳体固体发动机，用于即插即用地替换 5 段式 RSRM 助推器。燃料：复合固体推进剂。凭借更低的惰性质量与更高的海平面推力，可使 SLS 向低地球轨道发射超过 130 吨的有效载荷，燃烧约 110 秒。
		//		Astris
		#roAstrisTitle = Astris 液体火箭发动机
		#roAstrisDesc = Astris 于 20 世纪 60 年代由德国研制，是挤压式真空发动机。燃料：混肼-50/四氧化二氮（Aerozine-50/NTO）。用于欧罗巴一号与二号（Europa I/II）运载火箭的同名上面级，单台，可多次点火，燃烧约 330 秒。
		//B
		//		BabySergeant
		#roBabySergeantTitle = Baby Sergeant（5.4KS-1975）固体火箭发动机
		#roBabySergeantDesc = Baby Sergeant 于 20 世纪 50 年代研制，是小型固体变轨发动机，用作丘比特-C（Jupiter-C）探空火箭（后为朱诺一号与二号运载火箭）的上层，按 11 枚、3 枚、最终 1 枚挂于有效载荷的组合方式使用。燃料：聚硫橡胶复合推进剂。标准型采用 T17-E2 药柱，高性能型采用 JPL-532A，燃烧约 6 秒。
		//		BE3
		//		BE3U
		#roBE3Title = BE-3U 液体火箭发动机
		#roBE3Desc = BE-3U 于 21 世纪 10 年代由蓝色起源（Blue Origin）研制。BE-3（Blue Engine 3）是采用抽气循环的液氧液氢发动机，BE-3U 是为真空使用大幅升级的型号，配大型喷管与极高的推重比。燃料：液氧/液氢。可节流，可多次点火，总燃烧时长约 644 秒。
		//		BE4
		#roBE4Title = BE-4 液体火箭发动机
		#roBE4Desc = BE-4 由蓝色起源研制，是富氧分级燃烧液氧甲烷发动机，最初为蓝色起源自身的运载火箭研制。燃料：液氧/甲烷。2014 年联合发射联盟（ULA）宣布其新火箭火神（Vulcan）将由两台 BE-4 提供动力，可节流（30%–100%），燃烧约 400 秒。
		//		BNTR
		#roBNTRTitle = 双模式核热火箭发动机
		#roBNTRDesc = 双模式核热火箭发动机由 NERVA 原始设计演化而来，是低推力泵压式膨胀循环核热发动机。与把宝贵工质浪费在冷却反应堆上不同，它用布雷顿循环发电机组把废热转化为电能，还支持液氧注入（TRITON 三模式工作）以更高推力运行，代价是总效率降低。推进模式燃料：液氢（经反应堆加热）；TRITON 三模式燃料：液氢+液氧注入。寿命约 10 小时，可节流，可多次点火。
		//		BNTR 25k
		#roBNTR25kTitle = 双模式 HALEU 核热火箭发动机（25 klbf）
		#roBNTR25kDesc = 双模式 HALEU 核热火箭发动机出自较晚的研究，比原始 BNTR 设计更大，是中等推力泵压式膨胀循环核热发动机。它采用高丰度低浓缩铀（HALEU）以降低成本，并配备功率大得多的布雷顿发电机为电推进系统供电。推进模式燃料：液氢（经反应堆加热）；TRITON 三模式燃料：液氢+液氧注入。单次任务燃烧约 1.75 小时，设计寿命为 9 次任务。
		//C
		//		C-1
		#roC1Title = C-1 液体火箭发动机
		#roC1Desc = C-1 是 20 世纪 60 年代初为阿波罗计划研制的小型自燃发动机，并计划用于"航海家火星"（Voyager Mars）探测器。燃料：自燃推进剂。因阿波罗最终选用 R-4D，而"航海家火星"计划被取消，它从未在太空使用，燃烧时长可靠消息暂无。
		//		Cajun
		#roCajunTitle = Cajun (2.8KS-8100) 固体火箭发动机
		#roCajunDesc = Cajun 由美国泰奥科尔（Thiokol）公司于 20 世纪 50 年代研制，作为 Deacon 发动机的高性能后继型号。燃料：固体推进剂。用于"奈基-卡真"（Nike-Cajun）探空火箭二级（1 台），燃烧约 3 秒。
		//		Castor-1
		#roCastor-1Title = Castor 1 固体火箭发动机
		#roCastor-1Desc = Castor 1 由美国泰奥科尔（Thiokol）公司基于"中士"（Sergeant）导弹发动机研制，1960 年随 Scout X-1 完成首次亚轨道飞行。燃料：固体推进剂。它用作 Scout 火箭二级，也用作雷神（Thor）一级运载火箭（含 Delta-D）的捆绑式助推器，燃烧约 27 秒。
		//		Castor-2
		#roCastor-2Title = Castor 2 固体火箭发动机
		#roCastor-2Desc = Castor 2 由美国泰奥科尔（Thiokol）公司在 Castor 1 基础上改进研制，比冲与装药量更高、干质量占比更低、燃烧时间更长。燃料：固体推进剂。自 Delta E 起用作捆绑式助推器，并用于除最早型号外的各型 Scout，燃烧约 39 秒。
		//		Castor-4
		#roCastor-4Title = Castor 4 固体火箭助推器
		#roCastor-4Desc = Castor 4 由美国泰奥科尔（Thiokol）公司研制，最初作为"雅典娜"H（Athena H）导弹二级，1971 年首飞，后被改装替换 Delta 的 Castor 2 助推器，Delta 3000 系列于 1975 年投入使用。燃料：聚丁二烯丙烯酸（PBAA）复合推进剂。因该助推器更重且燃烧更久，采用了燃尽即抛的交错点火与分离序列，燃烧约 54 秒。
		//		Castor-4A
		#roCastor-4ATitle = Castor 4A 固体火箭助推器
		#roCastor-4ADesc = Castor 4A 由美国泰奥科尔（Thiokol）公司研制，将 PBAA 换为能量更高的端羟基聚丁二烯（HTPB）以提升推力与比冲，随 Delta II 6000 系列投入使用。燃料：端羟基聚丁二烯（HTPB）。1989–1993 年用作 Delta II 捆绑式助推器，1993–2004 年亦用于 Atlas IIAS，燃烧约 53 秒。
		//		Castor-4AXL
		#roCastor-4AXLTitle = Castor 4AXL 固体火箭助推器
		#roCastor-4AXLDesc = Castor 4AXL 由美国泰奥科尔（Thiokol）公司在 Castor 4A 基础上加长改进，1992 年 5 月首次试车，性能提升约 30%。燃料：端羟基聚丁二烯（HTPB）。用作 Atlas IIAS、H-II 等运载火箭的捆绑式助推器，2001 年首飞，燃烧约 60 秒。
		//		Castor-30A
		#roCastor-30ATitle = Castor 30A 固体火箭发动机
		#roCastor-30ADesc = Castor 30A 由美国 ATK 公司（现诺斯罗普·格鲁曼）研制，为低成本、大直径固体上面级发动机，可按运载器构型用作第二或第三级。燃料：固体推进剂。用于安塔瑞斯（Antares）运载火箭二级（1 台），燃烧约 155 秒。
		//		Castor-30B
		#roCastor-30BTitle = Castor 30B 固体火箭发动机
		#roCastor-30BDesc = Castor 30B 由美国 ATK 公司（现诺斯罗普·格鲁曼）在 Castor 30 基础上改进研制，主要变化为换用新的推进剂配方并加长喷管。燃料：固体推进剂（换用能量更高的配方）。用于安塔瑞斯（Antares）运载火箭二级（1 台），燃烧约 127 秒。
		//		Castor-30XL
		#roCastor-30XLTitle = Castor 30XL 固体火箭发动机
		#roCastor-30XLDesc = Castor 30XL 由美国 ATK 公司（现诺斯罗普·格鲁曼）研制，为 Castor 30 的大幅加长型，配备 8 英尺长内埋式高膨胀比喷管（膨胀比 55.9:1）。燃料：固体推进剂。用于安塔瑞斯（Antares）运载火箭二级（1 台），燃烧约 165 秒。
		//		Castor-120
		#roCastor-120Title = Castor 120 固体火箭发动机
		#roCastor-120Desc = Castor 120 由美国泰奥科尔（Thiokol）公司研制，设计基于"和平卫士"（Peacekeeper）洲际导弹一级的 TU-903 发动机。燃料：端羟基聚丁二烯（HTPB）。用作米诺陶（Minotaur）与"雅典娜"（Athena）运载火箭一级，燃烧约 79 秒。
		//		COBRA
		#roCOBRATitle = COBRA 液体火箭发动机
		#roCOBRADesc = COBRA（协同优化可重复使用助推器）于 21 世纪初由美国在太空发射倡议（Space Launch Initiative）计划下研制，拟作为航天飞机的替代运载器主发动机，采用大气层内分级燃烧循环。燃料：液氧/液氢。性能极高，但在原型阶段被取消，燃烧时长可靠消息暂无。
		//		COBRAH
		#roCOBRAHTitle = COBRA-H 液体火箭发动机
		#roCOBRAHDesc = COBRA-H 由普惠-阿罗杰特推进联合公司（Pratt & Whitney-Aerojet Propulsion Associates）于 2003 年提出设计，旨在覆盖宽广的推力范围，采用单燃烧室、富燃分级燃烧循环。燃料：液氧/液氢。作为长寿命、中高推力的可重复使用助推发动机提出，未投入研制，燃烧时长可靠消息暂无。
		//D
		//		DFMMHPE
		#roDFMMHPETitle = DFMMHPE 液体火箭发动机
		#roDFMMHPEDesc = DFMMHPE 由美国阿罗杰特（Aerojet）公司为单级入轨（SSTO）飞行器研制，采用双燃料双模式高压循环。海平面段燃料：液氧/煤油（RP-1）；高空段燃料：液氧/液氢，并伸出延伸喷管以获得更高性能。该发动机从未投入飞行，燃烧时长可靠消息暂无。
		//		Dropt
		#roDroptTitle = P0.68 Dropt 固体火箭发动机
		#roDroptDesc = Dropt（P0.68）是法国小型固体火箭发动机，最初为欧罗巴二号（Europa II）运载火箭第四级研制，后用作"钻石"（Diamant）B 与 BP.4 构型的第三级。燃料：固体推进剂。燃烧时长可靠消息暂无。
		//		DS4G
		#roDS4GTitle = DS4G 栅极离子推进器
		#roDS4GDesc = DS4G（双级四栅格）栅极离子推进器由欧洲空间局（ESA）研制，面向多种未来深空任务，本型号为其最坚固的设计。燃料：氙（Xenon）。需约 50 kW 电功率，供深空任务长期连续工作；该发动机基于技术设计与试验件研制。
		//E
		//		E1
		#roE1Title = E-1 液体火箭发动机
		#roE1Desc = E-1 由美国洛克达因（Rocketdyne）公司基于 LR79/89 研制，为开式循环液氧煤油起飞发动机，曾作为大力神一号（Titan 1）一级发动机的后备方案，并被提议用于土星一号（Saturn 1）一级，但从未飞行（最终由 8 台 H-1 取代 4 台 E-1）。燃料：液氧/煤油（RP-1）。燃烧时长可靠消息暂无。
		//		EAP-241
		#roEAP-241Title = P241/A EAP 固体火箭助推器
		#roEAP-241Desc = P241/A EAP 由欧洲多国联合研制，是"阿丽亚娜"五号（Ariane 5）运载火箭的固体捆绑助推器，用于起飞及飞行初期。燃料：固体推进剂。成对使用（2 台），燃烧约 130 秒。
		//		EPEX
		#roEPEXTitle = EPEX 磁等离子体动力推进器（MPD）
		#roEPEXDesc = EPEX（电推进实验）是日本研制的脉冲磁等离子体动力推进器，1995 年在"太空飞行器单元"（Space Flyer Unit, SFU）卫星上进行了试验。工质：气体（脉冲式工作）。SFU 是首个以 MPD 推进器为主推进系统的航天器（苏联此前虽曾广泛试验 MPD 推进器），无连续燃烧时长。
		//F
		//		F1
		#roF1Title = F-1 液体火箭发动机
		#roF1Desc = F-1 由美国洛克达因（Rocketdyne）公司于 20 世纪 60 年代研制，是有史以来最大、最强大的火箭发动机之一，为土星五号（Saturn V）提供动力。燃料：液氧/煤油（RP-1）。土星五号一级装 5 台，燃烧约 165 秒。
		//		F-1A_ETS
		#roF-1A_ETSTitle = F-1A (ETS) 液体火箭发动机
		#roF-1A_ETSDesc = F-1A 是洛克达因（Rocketdyne）公司在 F-1 基础上研制的可节流改进型号，用于大型重型运载火箭。燃料：液氧/煤油（RP-1）。本部件对应"Eyes Turned Skyward"模组中的可节流 F-1A 构型，燃烧时长可靠消息暂无。
		//		FARAD
		#roFARADTitle = FARAD 脉冲感应推进器
		#roFARADDesc = FARAD（法拉第射频辅助放电加速器）脉冲感应推进器用强磁脉冲电离并加速气体，可通过提高脉冲频率简单放大规模。工质：气体（脉冲式工作）。它利用射频辅助预电离，大幅降低所需脉冲能量，因而可制成更小型的推进器，无连续燃烧时长。
		//		F1B
		#roF1BTitle = F-1B 液体火箭发动机
		#roF1BDesc = F-1B 由美国洛克达因（Rocketdyne）公司设计，拟为"太空发射系统"（SLS）的 Pyrios 先进助推器提供动力，是 F-1 的深度改进型，采用 3D 打印等现代制造工艺并简化燃气发生器排气布置，在略微牺牲效率的同时降低成本并提高推力。燃料：液氧/煤油（RP-1）。随 Pyrios 方案未获采用，燃烧时长可靠消息暂无。
		//		FW5
		#roFW5Title = FW-5 固体火箭发动机
		#roFW5Desc = FW-5 由美国化学系统部（CSD）于 1970 年研制，在成熟的 FW-4 发动机基础上发展而来。燃料：端羟基聚丁二烯（HTPB）。为休斯（Hughes）HS-333 卫星平台（含安尼克 Anik、西星 Westar、Marisat 等）提供远地点变轨，共飞行 17 次，燃烧时长可靠消息暂无。
		//G
		//		G1
		#roG1Title = G-1 液体火箭发动机
		#roG1Desc = G-1 于 20 世纪 60 年代为 NOMAD 高能上面级研制，旨在替代阿杰纳（Agena）上面级。燃料：肼/氟。试验中性能出色，但氟的毒性令人担忧，项目在投入大量工作后被取消，燃烧时长可靠消息暂无。
		//		Gamma2
		#roGamma2Title = Gamma 2 液体火箭发动机
		#roGamma2Desc = Gamma 2 由英国布里斯托尔·西德利（Bristol Siddeley）公司研制，是"黑箭"（Black Arrow）运载火箭二级的双燃烧室版本。燃料：过氧化氢（HTP）/煤油。作为黑箭二级（1 台双室），因无需海平面工作，喷管加长以获得更好的膨胀，燃烧时长可靠消息暂无。
		//		Gamma8
		#roGamma8Title = Gamma 8 液体火箭发动机
		#roGamma8Desc = Gamma 8 是 Gamma 发动机的八燃烧室版本，用于"黑箭"（Black Arrow）运载火箭一级。燃料：过氧化氢（HTP）/煤油。燃烧室成对径向安装，各配单轴切向摆动机构，同向摆动控制滚转、差动摆动控制俯仰，燃烧时长可靠消息暂无。
		//		Gamma301
		#roGamma301Title = Gamma-201/301 液体火箭发动机
		#roGamma301Desc = Gamma-201/301 是 Gamma 发动机的四燃烧室版本，用于"黑骑士"（Black Knight）探空火箭一级。燃料：过氧化氢（HTP）/煤油。燃烧室成对径向安装，各配单轴切向摆动机构，同向摆动控制滚转、差动摆动控制俯仰，燃烧时长可靠消息暂无。
		//		GCRC
		#roGCRCTitle = GCRC 33KS-2800 固体火箭发动机
		#roGCRCDesc = GCRC（33KS-2800）是美国小型固体变轨发动机，用作"先锋"（Vanguard）运载火箭除最后一次发射外全部任务的第三级。燃料：固体推进剂。燃烧约 33 秒。
		//		GEM-40
		#roGEM-40Title = GEM 40 固体火箭助推器
		#roGEM-40Desc = GEM 40（石墨环氧发动机）由美国研制，以更轻的复合材料壳体取代早期 Castor 系列助推器的钢壳体。燃料：端羟基聚丁二烯（HTPB）。用作 Delta II 7000 系列捆绑式助推器，按 3、4 或 9 台配置；9 台构型中 6 台地面点火、其余 3 台待其燃尽分离后点火，燃烧约 58 秒。
		//		GEM-46
		#roGEM-46Title = GEM 46 固体火箭助推器
		#roGEM-46Desc = GEM 46 由美国研制，直径 46 英寸（1.2 米），用于 Delta III 与德尔塔二号重型（Delta II Heavy）。燃料：端羟基聚丁二烯（HTPB）。按 9 台配置，6 台地面点火、3 台待前 6 台燃尽后点火；Delta III 的 3 台地面点火助推器带推力矢量控制，其余为固定喷管，燃烧约 75 秒。
		//		GEM-60
		#roGEM-60Title = GEM 60 固体火箭助推器
		#roGEM-60Desc = GEM 60 由美国研制，直径 60 英寸（1.5 米），用于 Delta IV 运载火箭。燃料：端羟基聚丁二烯（HTPB）。按 2 台或 4 台配置：2 台时均带推力矢量控制（TVC），4 台时 2 台带 TVC、2 台用固定喷管以减重，燃烧约 90 秒。
		//		GEM-63
		#roGEM-63Title = GEM 63 固体火箭助推器
		#roGEM-63Desc = GEM 63 由轨道 ATK（Orbital ATK，现诺斯罗普·格鲁曼）研制，2015 年联合发射联盟（ULA）选定其作为 AJ-60A 的直接替换助推器用于阿特拉斯五号（Atlas V）。燃料：端羟基聚丁二烯（HTPB）。比 GEM 60 更大且不带推力矢量控制；4 米整流罩构型最多 3 台、5 米整流罩构型最多 5 台，燃烧约 94 秒。
		//		GEM-63XL
		#roGEM-63XLTitle = GEM 63XL 固体火箭助推器
		#roGEM-63XLDesc = GEM 63XL 由轨道 ATK（Orbital ATK，现诺斯罗普·格鲁曼）为"火神"（Vulcan）运载火箭研制，是 GEM 63 的加长型，长约 1.5 米。燃料：端羟基聚丁二烯（HTPB）。4 米整流罩构型最多 4 台、5 米整流罩构型最多 6 台，燃烧约 94 秒。
		//H
		//		H1
		#roH1Title = H-1/RS-27 液体火箭发动机
		#roH1Desc = H-1 由洛克达因公司在 LR79 基础上研制，1961 年随土星 I 首飞，为土星 I/IB 提供一级动力，其现代化改型以 RS-27 之名用于德尔塔火箭。燃料：液氧/煤油（RP-1）。土星 I/IB 一级以 8 台并联布置，燃烧约 155 秒；作为 RS-27 用于德尔塔一级时燃烧约 274 秒。
		//		HERMeS
		#roHERMESTitle = HERMeS 霍尔效应推进器
		#roHERMESDesc = HERMeS（磁屏蔽霍尔效应火箭）由美国宇航局格伦研究中心于 21 世纪 10 年代研制，是采用磁屏蔽技术延长寿命的实验性霍尔效应推进器，后来发展为月球门户空间站的推进系统 AEPS。燃料：氙。设计用于长期连续运行，工作寿命长。
		//		HG3
		#roHG3Title = HG-3 液体火箭发动机
		#roHG3Desc = HG-3 由洛克达因公司于 20 世纪 60 年代中期研制，是介于 J-2 与 RS-25 之间的技术过渡型号，采用高压分级燃烧循环，为航天飞机主发动机积累经验。燃料：液氧/液氢。原计划用于大型火箭上面级，未投产，燃烧时长可靠消息暂无。
		//		HiPEP
		#roHIPEPTitle = HiPEP 栅极离子推进器
		#roHIPEPDesc = HiPEP（高功率电推进系统）由美国宇航局格伦研究中心于 21 世纪初设计与测试，用于核动力深空飞船等高功率航天器，可提供比同类小型号更大的推力。燃料：氙。工作功率约 39.3 kW，设计用于长期连续运行。
		//		HM7
		#roHM7Title = HM-7 液体火箭发动机
		#roHM7Desc = HM-7 由斯奈克玛公司（Snecma）于 20 世纪 70 年代在 HM4 试验发动机基础上研制，为欧空局阿里安系列运载火箭提供上面级动力。燃料：液氧/液氢。用于阿里安 1–4 的第三级及阿里安 5 ECA 的低温上面级，单次燃烧约 570–780 秒（视构型），在阿里安 5 ECA 上可连续燃烧约 950 秒。
		//I
		//		ID-500
		#roID500Title = ID-500 栅极离子推进器
		#roID500Desc = ID-500 由俄罗斯研制，是为"运输与能源模块"（TEM）核动力拖船开发的栅极离子推进器。燃料：氙。该发动机尚未投入飞行，设计用于核动力拖船上的长期连续工作。
		//		INsTAR
		#roINsTARTitle = INsTAR 核热火箭发动机
		#roINsTARDesc = INsTAR 是基于 SNTP/Timberwind 粒子床设计的先进核热火箭概念，采用耐高温合金与烧结燃料元件，比冲可超过 1000 秒。燃料：液氢（经反应堆加热）。使用低浓缩铀虽降低推重比，但大幅延长堆芯寿命；该设计未建造，燃烧时长可靠消息暂无。
		//J
		//		J2
		#roJ2Title = J-2 液体火箭发动机
		#roJ2Desc = J-2 由洛克达因公司于 1960 年获批研制、1966 年随 AS-201 任务首飞，是美国首个大型液氧液氢发动机。燃料：液氧/液氢。土星 V 的 S-II 级装 5 台、单次燃烧约 395 秒；S-IVB 级装 1 台、可两次点火（累计约 470 秒）；土星 IB 的 S-IVB 级亦装 1 台。设计总燃烧时长约 500 秒。
		//		J2T
		#roJ2TTitle = J-2T 液体火箭发动机
		#roJ2TDesc = J-2T 由洛克达因公司于 20 世纪 60 年代末在 J-2S 基础上研制，是采用环形塞式（气尖）喷管的验证型发动机，旨在以气尖喷管改善高空性能。燃料：液氧/液氢。随阿波罗计划结束而取消，未投入飞行，燃烧时长可靠消息暂无。
		//		J2X
		#roJ2XTitle = J-2X 液体火箭发动机
		#roJ2XDesc = J-2X 由洛克达因公司于 21 世纪 00 年代研制，原为战神一号与战神五号运载火箭的上面级设计，后一度计划用于太空发射系统（SLS）。燃料：液氧/液氢。战神计划取消后开发一度延续，最终因选用 RL10 驱动的探索上面级而搁置，设计单次燃烧约 500 秒，未投入飞行。
		//		Juno6k
		#roJuno6kTitle = Juno IV 6K 液体火箭发动机
		#roJuno6kDesc = Juno IV 6K 由喷气推进实验室（JPL）于 20 世纪 50 年代末研制，是早期挤压式自燃上面级发动机，为 Juno IV 运载火箭第三级设计。燃料：自燃推进剂（具体组分可靠消息暂无）。Juno IV 取消后曾拟用于 Atlas-Vega 的 Vega 上面级，该计划于 1959 年终止；发动机经多次试车但从未飞行，燃烧时长可靠消息暂无。
		//		Juno45k
		#roJuno45kTitle = Juno IV 45K 液体火箭发动机
		#roJuno45kDesc = Juno IV 45K 由喷气推进实验室（JPL）于 20 世纪 50 年代末研制，是为 Juno IV 运载火箭第二级设计的高性能发动机，真空推力约 45,000 磅。燃料：可靠消息暂无。经试车后最终未获采用（改用 X-405），未投入飞行，燃烧时长可靠消息暂无。
		//K
		//		Kestrel
		#roKestrelTitle = Kestrel 液体火箭发动机
		#roKestrelDesc = Kestrel 由 SpaceX 于 21 世纪初为猎鹰一号运载火箭研制，采用挤压式输送以简化结构、降低成本。燃料：煤油/液氧（RP-1）。用于猎鹰一号第二级（1 台），单次燃烧约 378 秒，并具备再点火能力（Kestrel 2 累计可燃烧约 418 秒）。
		//		Kestrel_1B
		#roKestrel_1BTitle = Kestrel-1B 液体火箭发动机
		#roKestrel_1BDesc = Kestrel-1B 是原 Kestrel 的液氧甲烷改型，为猎鹰一号运载火箭上面级升级设想，具备多次点火能力与有限的节流范围。燃料：液氧/甲烷。该型号未投入飞行，燃烧时长可靠消息暂无。
		//		KIWIA24
		#roKIWIA24Title = Kiwi A3 核热火箭发动机
		#roKIWIA24Desc = Kiwi A3 由洛斯阿拉莫斯科学实验室于 1959–1961 年在 Rover 计划下研制，是验证核热推进概念的地面试验发动机，美国后续核热火箭设计均源于此概念。燃料：液氢（经反应堆加热）。单次试验运行约 5 分钟，堆芯可启动两次。
		//		KIWIB48
		#roKIWIB48Title = Kiwi B4E 核热火箭发动机
		#roKIWIB48Desc = Kiwi B4E 由洛斯阿拉莫斯科学实验室在 Rover 计划下研制，是功率密度为 A 系列十倍以上的大功率地面试验发动机，为 NERVA 验证了燃料元件与先进涂层工艺。燃料：液氢（经反应堆加热）。最终试验运行约 12 分钟（其中约 8 分钟为全功率），堆芯可启动四次。
		//		KRD61
		#roKRD61Title = KRD-61 液体火箭发动机
		#roKRD61Desc = KRD-61 由苏联于 20 世纪 60 年代末研制，是为 E-8-5 月球采样返回探测器返回级设计的燃气发生器循环自燃真空发动机。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。仅支持一次点火，对入轨精度要求极高，单次燃烧时长可靠消息暂无。
		//		KRD79
		#roKRD79Title = KRD-79 液体火箭发动机
		#roKRD79Desc = KRD-79 由苏联于 20 世纪 70 年代为礼炮-6/礼炮-7 空间站研制，是挤压式输送的自燃真空发动机，后亦用于和平号空间站与星辰号服务舱。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。用于轨道机动与姿态修正，可多次点火，单次燃烧时长依任务而定。
		//		KRD442
		#roKRD442Title = KRD-442 液体火箭发动机
		#roKRD442Desc = KRD-442 由苏联于 20 世纪 70 年代为 TKS 飞船的功能货舱（FGB）研制，是燃气发生器循环自燃真空发动机。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。凭借高可靠性与再点火能力，广泛用于 FGB 衍生模块（阿尔马兹后期型号、斯基夫平台、量子-1/量子-2、晶体号、光谱号、自然号、曙光号、科学号等），其泵还可用于舱内输运燃料或接收进步号补加，总燃烧时长可靠消息暂无。
		//		KTDU5A
		#roKTDU5ATitle = KTDU-5A 液体火箭发动机
		#roKTDU5ADesc = KTDU-5A 由苏联于 20 世纪 60 年代研制，是月球探测器 E-6 平台推进系统的燃气发生器循环自燃真空发动机，用于苏联首批月球着陆器与月球轨道器。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。用于中途修正与近月制动，着陆器末段下降切换为游动发动机，单次燃烧时长依任务而定。
		//		KTDU35
		#roKTDU35Title = KTDU-35 液体火箭发动机
		#roKTDU35Desc = KTDU-35 由苏联于 20 世纪 60 年代为第一代联盟号/进步号飞船（7K 系列）研制，是燃气发生器循环自燃发动机，可多次点火。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。由单喷管主发动机 S5.60 与双喷管备份发动机 S5.35 组成，主发动机失效时由备份接管，总燃烧时长可靠消息暂无。
		//		KTDU416
		#roKTDU416Title = KTDU-416 液体火箭发动机
		#roKTDU416Desc = KTDU-416 由苏联于 20 世纪 60 年代末为 LK-700S 载人登月飞船研制，用作游动与着陆发动机。燃料：自燃推进剂。3 台用于地月转移级与近月制动级的游动控制，另 3 台用于 LK-700S 的可控最终下降；随 LK-700S 计划取消而未飞行，燃烧时长可靠消息暂无。
		//		KTDU417
		#roKTDU417Title = KTDU-417 液体火箭发动机
		#roKTDU417Desc = KTDU-417 由苏联于 20 世纪 60–70 年代为月球 15–24 号采样返回探测器研制，是着陆发动机。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。主发动机（燃气发生器循环）用于轨道机动与下降，末段切换至挤压式副发动机完成最终着陆，单次燃烧时长依任务而定。
		//		KTDU425A
		#roKTDU425ATitle = KTDU-425 液体火箭发动机
		#roKTDU425ADesc = KTDU-425 由苏联于 20 世纪 60 年代研制，是用于火星与金星探测器 3MV、4MV、5MV 平台的燃气发生器循环自燃真空发动机。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。用于中途修正与制动入轨，可多次点火，单次燃烧时长依任务而定。
		//		KVD1
		#roKVD1Title = RD-56/KVD-1/CE-7.5 液体火箭发动机
		#roKVD1Desc = RD-56/KVD-1 由苏联伊萨耶夫设计局自 20 世纪 60 年代起为 N-1M 登月火箭的低温上面级研制，后授权印度用于 GSLV 运载火箭上面级，其印度国产改型为 CE-7.5。燃料：液氧/液氢。采用分级燃烧循环，主喷管固定、由两个游动喷管联合提供俯仰-偏航-滚转控制；KVD-1 累计燃烧约 800 秒（单次约 600 秒），CE-7.5 名义燃烧约 720 秒。
		//L
		//		LE3
		#roLE3Title = LE-3 液体火箭发动机
		#roLE3Desc = LE-3 由三菱重工于 20 世纪 60 年代在洛克达因公司协助下研制，是为 N-I 运载火箭第二级提供动力的小型挤压式自燃发动机。燃料：混肼-50/四氧化二氮（Aerozine-50/NTO）。用于 N-I 第二级（1 台），燃烧约 400 秒。
		//		LE5
		#roLE5Title = LE-5 液体火箭发动机
		#roLE5Desc = LE-5 由三菱重工与日本宇宙开发事业团（NASDA）于 20 世纪 70–80 年代研制，是日本首台自主开发的氢氧发动机，为 H-1 运载火箭第二级设计，后彻底改型为世界首款膨胀循环放气循环（expander bleed）发动机用于 H-II。燃料：液氧/液氢。用于 H-1 第二级时燃烧约 370 秒；其后继型号 LE-5B/LE-5B-3 用于 H-IIA/H-IIB 与 H-3 第二级，单次任务燃烧约 740 秒。
		//		LE7
		#roLE7Title = LE-7 液体火箭发动机
		#roLE7Desc = LE-7 由三菱重工于 20 世纪 80–90 年代为 H-II 运载火箭研制，是日本首台富燃分级燃烧循环的大型氢氧发动机。燃料：液氧/液氢。用于 H-II 芯级（1 台），燃烧约 346 秒；改进型 LE-7A 以降低成本、提升可靠性为目标，用于 H-IIA/H-IIB 芯级，燃烧约 390 秒。
		//		LE9
		#roLE9Title = LE-9 液体火箭发动机
		#roLE9Desc = LE-9 由三菱重工与 JAXA 自 2014 年起为 H-3 运载火箭研制，是首个采用膨胀循环放气循环（expander bleed）的大推力一级发动机，旨在简化结构、降低成本并提升可靠性。燃料：液氧/液氢。用于 H-3 芯级（2–3 台并联），可节流，单次燃烧时长依任务而定。
		//		LEROS1b
		#roLEROS1bTitle = LEROS-1b（635 N）液体火箭发动机
		#roLEROS1bDesc = LEROS-1b 由 Moog-ISP（现 Nammo）研制，是 635 N 级双组元远地点发动机，用作通信卫星（如洛克希德·马丁 A2100 平台）的远地点变轨发动机，以及朱诺号木星探测器的主发动机。燃料：肼/混合氮氧化物（Hydrazine/MON）。可多次再点火，单次最长燃烧约 2520 秒，累计燃烧时长可达约 20000 秒（鉴定值）。
		//		LEROS4
		#roLEROS4Title = LEROS-4（1100 N）液体火箭发动机
		#roLEROS4Desc = LEROS-4 由 Moog（现 Nammo）在欧空局资助下研制，是 1100 N 级大推力远地点发动机，旨在减少行星际航天器入轨机动所需推进剂、增加科学载荷质量。燃料：自燃推进剂（具体组分可靠消息暂无）。尚在研制中，燃烧时长可靠消息暂无。
		//		Lightbulb
		#roLightbulbTitle = Light-Bulb 闭式循环气芯核热火箭发动机
		#roLightbulbDesc = Light-Bulb（灯泡）由美国于 20 世纪 60 年代提出，是闭式循环气芯核热火箭概念：裂变材料封存于熔融石英"灯泡"内、以循环氖气冷却，避免裂变材料逸出。燃料：液氢（经反应堆加热）。仅停留在概念研究阶段，未建造，燃烧时长可靠消息暂无。
		//		LMAE
		#roLMAETitle = 登月舱上升发动机（LMAE）
		#roLMAEDesc = 登月舱上升发动机（LMAE）由美国于 20 世纪 60 年代为阿波罗登月舱上升级研制，是挤压式输送的自燃发动机。燃料：混肼-50/四氧化二氮（Aerozine-50/NTO）。用于登月舱上升级（1 台），单次上升燃烧约 7 分钟（约 440 秒）。
		//		LMDE
		#roLMDETitle = 登月舱下降发动机（LMDE）
		#roLMDEDesc = 登月舱下降发动机（LMDE）由 TRW 公司于 1964–1972 年为阿波罗登月舱下降级研制，是挤压式输送、可深度节流（10%–60%）的自燃发动机。燃料：混肼-50/四氧化二氮（Aerozine-50/NTO）。用于登月舱下降级（1 台），设计总燃烧时长约 1030 秒（单次下降约 750 秒）；J 级任务型号比冲略高以支持月球车载荷，改型 TR-201 用于德尔塔 P 系列上面级。
		//		LPNTR
		#roLPNTRTitle = LPNTR 低压核热火箭发动机
		#roLPNTRDesc = LPNTR（低压核热火箭）是一种高性能核热火箭概念，通过将室压降至接近大气压使双原子氢解离为单原子氢，从而大幅提升比冲。燃料：液氢（经反应堆加热）。低室压使结构极轻、无需泵，以氢作慢化剂实现自调节，但无喷管摆动能力；仅停留在概念阶段，燃烧时长可靠消息暂无。
		//		LR79
		#roLR79Title = LR79 液体火箭发动机
		#roLR79Desc = LR79 由洛克达因公司于 20 世纪 50 年代中期研制，是长寿命的燃气发生器循环煤油起飞发动机，与 LR89 共用组件、性能相当。燃料：液氧/煤油（RP-1）。以 S-3D 之名用于朱庇特/朱诺二号，以 MB-3 之名用于雷神及雷神-德尔塔（德尔塔）一级，燃烧约 160 秒。
		//		LR83
		#roLR83Title = LR83 液体火箭发动机
		#roLR83Desc = LR83 由洛克达因公司于 20 世纪 50 年代为纳瓦霍（Navaho）巡航导弹研制，是燃气发生器循环的液氧煤油起飞发动机。燃料：液氧/煤油（RP-1）。原计划以 3 台可摆动布局用于 Navaho 助推器，随项目取消而未飞行，燃烧时长可靠消息暂无。
		//		LR87
		#roLR87Title = LR87 液体火箭发动机
		#roLR87Desc = LR87 由阿罗杰特公司于 20 世纪 50 年代末为泰坦导弹系列研制，是双燃烧室、各带独立涡轮泵并整合为一组的起飞发动机。燃料：泰坦一号使用液氧/煤油（RP-1），泰坦二号至四号改用混肼-50/四氧化二氮（Aerozine-50/NTO）。用于泰坦系列一级，单次燃烧约 140–165 秒（依构型）；曾研制燃用液氢的改型用于土星上面级，但最终选用了 J-2。
		//		LR87LH2
		#roLR87LH2Title = AJ23-65 液体火箭发动机
		#roLR87LH2Desc = AJ23-65 由阿罗杰特公司于 1958–1960 年为美国空军潜在合同在 LR87 基础上改制，同期阿罗杰特正将 LR87 改为燃用混肼-50/四氧化二氮。燃料：液氧/液氢。曾竞标土星上面级动力，1961 年因美国宇航局选定 J-2 而终止，未投入飞行，燃烧时长可靠消息暂无。
		//		LR89
		#roLR89Title = LR43/LR89 液体火箭发动机
		#roLR89Desc = LR89 由洛克达因公司于 20 世纪 50 年代为宇宙神导弹研制，前身是乙醇/液氧的 XLR43-NA-3，也是美国首台采用管壁式燃烧室结构的发动机，改烧煤油后用于宇宙神，其衍生型号 LR79 用于雷神。燃料：液氧/煤油（RP-1）。以 2 台组成宇宙神助推器组（与主发动机 LR105、游动发动机 LR101 配合），燃烧约 120–175 秒（视型号）。
		//		LR91
		#roLR91Title = LR91 液体火箭发动机
		#roLR91Desc = LR91 由阿罗杰特公司于 20 世纪 50 年代末研制，为泰坦系列运载火箭第二级提供动力。燃料：泰坦一号使用液氧/煤油（RP-1），泰坦二号起改用混肼-50/四氧化二氮（Aerozine-50/NTO）。燃气发生器排气用于滚转控制，单次燃烧约 180–250 秒（依构型）。
		//		LR101
		#roLR101Title = LR101 液体火箭发动机
		#roLR101Desc = LR101 由洛克达因公司于 20 世纪 50 年代研制，是泵压或挤压式输送的液氧煤油游动发动机，为宇宙神/雷神系列火箭提供姿态控制与末速度修正。燃料：液氧/煤油（RP-1）。用于宇宙神的 MA-x 系统（2×LR89 + LR105 + 2×LR101）与雷神系列的 MB-x 系统（LR79/RS-27 + 2×LR101），随主发动机同步工作，燃烧时长依任务而定。
		//		LR105
		#roLR105Title = LR105 液体火箭发动机
		#roLR105Desc = LR105 由洛克达因公司于 20 世纪 50 年代为宇宙神"一级半"构型研制，是燃气发生器循环的煤油主发动机，助推器分离后独自将宇宙神送入轨道。燃料：液氧/煤油（RP-1）。用于宇宙神系列（1 台，配合游动发动机进行滚转控制与末速修正），燃烧约 270–430 秒（视型号）。
		//		LR129
		#roLR129Title = LR129 液体火箭发动机
		#roLR129Desc = LR129 由普惠公司于 20 世纪 60 年代为美国空军 ISINGLASS 高超声速侦察空天飞机研制，采用分级燃烧、混合比调节与可伸缩喷管以兼顾通用性与高性能。燃料：液氧/液氢。ISINGLASS 取消后其技术被普惠用于航天飞机主发动机（SSME）竞标方案，未投入飞行，燃烧时长可靠消息暂无。
		//		LRBE
		#roLRBETitle = LRBE 液体火箭发动机
		#roLRBEDesc = LRBE（液体火箭助推器发动机）由美国于 20 世纪 80 年代末至 90 年代初基于 RS-25 提出，是航天飞机液体捆绑助推器的设计概念，选用甲烷以提升密度与推力，同时保持富燃分级燃烧。燃料：液氧/甲烷。仅停留在概念阶段，未建造，燃烧时长可靠消息暂无。
		//		LRC LNTR
		#roLRCLNTRTitle = 刘易斯研究中心液态堆芯核热火箭发动机
		#roLRCLNTRDesc = 刘易斯研究中心液态堆芯核热火箭（LRC LNTR）由美国宇航局刘易斯研究中心于 20 世纪 60 年代研制，属"辐射式"液态堆芯核热火箭：液氢不穿过堆芯而先再生冷却堆壁，再流经堆芯中部被辐射加热。燃料：液氢（经反应堆加热）。相比"鼓泡式"堆芯效率略低，但与堆芯交互少、允许更高流量，推重比更大，且简化结构可在轨重新装填燃料；仅经地面研究，燃烧时长可靠消息暂无。
		//M
		//		M1
		#roM1Title = M-1 液体火箭发动机
		#roM1Desc = M-1 于 20 世纪 60 年代初由美国航空喷气公司（Aerojet）研制，是为后阿波罗时代的大型运载火箭（土星五号改进型与 Nova）研制的巨型上面级发动机，是有史以来设计过的最大的液氧/液氢发动机。燃料：液氧/液氢。它计划用于大型火箭上面级（可替代多台 J-2），仅完成部件级试验即被取消，设计燃烧时长约 400 秒，整机从未试车。
		//		M10
		#roM10Title = M10 液体火箭发动机
		#roM10Desc = M10 于 21 世纪 10 年代由意大利 Avio 公司研制，最初与俄罗斯化学自动装置设计局（KBKhA）合作、基于 RD-0146 发展而来，2014 年对俄制裁后由 Avio 独自完成研制。燃料：液氧/甲烷。它用于织女星-E（Vega-E）运载火箭的第三级（单台），计划 2026 年首飞，燃烧时长可靠消息暂无。
		//		M55
		#roM55Title = M55（民兵）固体火箭发动机
		#roM55Desc = M55 于 20 世纪 50 年代末由美国蒂奥科尔公司（Thiokol）研制，是民兵洲际弹道导弹的第一级固体发动机，后被 NASA 多型拟议运载火箭用作固体助推器。燃料：固体推进剂。它用于民兵导弹第一级及多种拟议运载火箭的助推级（单台），燃烧约 75 秒。
		//		MB35
		#roMB35Title = MB-35 液体火箭发动机
		#roMB35Desc = MB-35 于 21 世纪初由日本三菱重工与美国波音公司联合研制，是为德尔塔-4 低温上面级开发的膨胀泄压循环发动机。燃料：液氧/液氢。它用于德尔塔-4 上面级（单台），燃烧时长可靠消息暂无。
		//		MB45
		#roMB45Title = MB-45 液体火箭发动机
		#roMB45Desc = MB-45 于 21 世纪初由日本三菱重工与美国波音公司联合研制，是为德尔塔-4 低温上面级开发的膨胀泄压循环发动机。燃料：液氧/液氢。它用于德尔塔-4 上面级（单台），燃烧时长可靠消息暂无。
		//		MB60
		#roMB60Title = MB-60 液体火箭发动机
		#roMB60Desc = MB-60 于 21 世纪初由日本三菱重工与美国波音公司联合研制，是为德尔塔-4 低温上面级开发的膨胀泄压循环发动机。燃料：液氧/液氢。它用于德尔塔-4 上面级（单台），燃烧时长可靠消息暂无。
		//		Merlin1
		#roMerlin1Title = Merlin 1 液体火箭发动机
		#roMerlin1Desc = Merlin 1 是 SpaceX 于 21 世纪初研制的一整个液氧/煤油发动机家族，采用燃气发生器循环（开式），随猎鹰一号、猎鹰九号等火箭不断迭代升级。燃料：液氧/煤油（RP-1）。它用于猎鹰系列火箭的一级与二级（多台并联），燃烧时长依型号与构型而异。
		//		MR-80B
		#roMR-80BTitle = MR-80B（MLE）液体火箭发动机
		#roMR-80BDesc = MR-80B（火星着陆发动机，MLE）由美国航空喷气公司（Aerojet）研制，源自 1976 年海盗号两艘着陆器上表现优异的 MR-80 发动机。燃料：肼（单组元）。它用于好奇号火星车的空中吊车着陆系统（8 台），燃烧时长可靠消息暂无。
		//		MR-510
		#roMR510Title = MR-510 电弧加热推进器
		#roMR510Desc = MR-510 系列电弧加热推进器由美国航空喷气公司（Aerojet）研制，自 20 世纪 90 年代起为洛克希德·马丁 A2100 系列卫星提供轨道保持动力。燃料：肼（经电弧加热后喷出）。它用于 A2100 系列通信卫星的位置保持（多台），燃烧时长可靠消息暂无。
		//N
		//		NAA75_110
		#roNAA75_110Title = NAA-75-110 A 系列液体火箭发动机
		#roNAA75_110Desc = NAA-75-110 于 20 世纪 50 年代初由北美航空公司（North American Aviation）研制，是红石导弹与火箭家族的动力装置。燃料：酒精/液氧，用于红石及水星-红石构型；燃料：海代恩（Hydyne）/液氧，用于朱庇特-C 与朱诺一号构型，性能提高约 6%。它用于上述火箭的一级（单台），燃烧时长可靠消息暂无。
		//		NERVA
		#roNERVATitle = NERVA I 核热火箭发动机
		#roNERVADesc = NERVA I 于 20 世纪 60–70 年代由美国原子能委员会与美国宇航局（NASA）联合研制，是核火箭飞行应用发动机（Nuclear Engine for Rocket Vehicle Applications）系列面向轨道拖船和大型火箭上面级的型号。燃料：液氢（经反应堆加热）。它用于轨道拖船与大型火箭上面级（单台），燃烧时长可靠消息暂无。
		//		NERVAII
		#roNERVAIITitle = NERVA II 核热火箭发动机
		#roNERVAIIDesc = NERVA II 于 20 世纪 60 年代末研制，源自 1968 年完成试验的菲巴斯 2A（Phoebus 2A）地面验证堆，是功率约 4200 兆瓦的核热火箭发动机，推重比较低而比冲很高。燃料：液氢（经反应堆加热）。它用于大型火箭上面级与轨道拖船（单台），燃烧时长可靠消息暂无。
		//		NERVA_NRX
		#roNERVA_NRXTitle = NERVA NRX 核热火箭发动机
		#roNERVA_NRXDesc = NERVA NRX 于 20 世纪 60 年代由美国宇航局（NASA）与原子能委员会研制，是基于 KIWI B4E 的部分飞行试验原型，旨在验证可飞行的核热火箭发动机。燃料：液氢（经反应堆加热）。它用于地面试车验证，堆芯可启动约 30 次，燃烧时长可靠消息暂无。
		//		NERVA_XE
		#roNERVA_XETitle = Nerva XE-Prime 核热火箭发动机
		#roNERVA_XEDesc = Nerva XE-Prime 于 20 世纪 60 年代末由美国宇航局（NASA）研制，是基于 KIWI B4E 的全尺寸飞行试验原型，用于验证核热火箭发动机的飞行结构。燃料：液氢（经反应堆加热）。它用于地面试车验证，堆芯可启动约 60 次，燃烧时长可靠消息暂无。
		//		NEXT
		#roNEXTTitle = NEXT 栅极离子推进器
		#roNEXTDesc = NEXT（NASA 演化型氙离子推进器）由美国宇航局格伦研究中心于 21 世纪初研制，是经飞行认证的成熟栅极离子推进器，计划用于多个外太阳系深空任务。燃料：氙。它工作功率约 6.9 kW，以较长的燃烧时间换取有效载荷质量的大幅提升。
		//		Nike-M5E1
		#roNike-M5E1Title = 奈基 M5E1 固体火箭发动机
		#roNike-M5E1Desc = 奈基 M5E1 于 20 世纪 40 年代末由美国蒂奥科尔公司（Thiokol）研制，是奈基系列探空火箭通用的第一级固体发动机。燃料：固体推进剂。它用于奈基-迪肯、奈基-卡真、奈基-阿帕奇、奈基-阿罗比170、奈基-阿罗比350 等众多探空火箭的第一级（单台），燃烧时长可靠消息暂无。
		//		NK9
		#roNK9Title = NK-9 液体火箭发动机
		#roNK9Desc = NK-9 由苏联库兹涅佐夫设计局于 20 世纪 60 年代初为科罗廖夫的 GR-1 全球火箭研制，是液氧/煤油分级燃烧发动机，也是 N1 所用 NK-15 及沿用至今的 NK-33 的鼻祖。燃料：液氧/煤油（RP-1）。它用于 GR-1 一级（6 台），燃烧时长可靠消息暂无。
		//		NK9V
		#roNK9VTitle = NK-9V/21/19/39/31 液体火箭发动机
		#roNK9VDesc = NK-9V 由苏联库兹涅佐夫设计局为科罗廖夫的 GR-1 项目研制，是液氧/煤油分级燃烧真空上面级发动机，后来以 NK-19 之名用于 N1 火箭，并为 N1F 升级出具备再点火能力的 NK-31。燃料：液氧/煤油（RP-1）。它用于 GR-1 二级与 N1 上面级，燃烧时长可靠消息暂无。
		//		NK33
		#roNK33Title = NK-15/33 液体火箭发动机
		#roNK33Desc = NK-15/33 由苏联库兹涅佐夫设计局于 20 世纪 60–70 年代研制，是 N1 载人登月火箭计划的 150 吨级液氧/煤油富氧分级燃烧发动机。燃料：液氧/煤油（RP-1）。NK-15 用于 N1 一级（30 台）；NK-33 为 N1F 改进型（未首飞），1990 年代售予美国航空喷气公司，翻新为 AJ26-62 后用于安塔瑞斯火箭一级（2 台），燃烧约 235 秒。
		//		NK43
		#roNK43Title = NK-15V/43 液体火箭发动机
		#roNK43Desc = NK-43 由苏联库兹涅佐夫设计局于 20 世纪 60–70 年代为 N1F 火箭研制，是 NK-33 的真空型号，采用加长喷管并具备再点火能力。燃料：液氧/煤油（RP-1）。它用于 N1F 二级（8 台），燃烧时长可靠消息暂无。
		//		NSTAR
		#roNSTARTitle = NSTAR 栅极离子推进器
		#roNSTARDesc = NSTAR 由美国宇航局（NASA）于 20 世纪 90 年代研制，是首个投入飞行的大功率栅极离子推进器，使探测器得以在小行星带长期运行。燃料：氙。它用于深空一号（1 台）与黎明号（3 台）的主推进，累计工作时间可达数千小时。
		//		NUPIT
		#roNUPITTitle = NuPIT 脉冲感应推进器
		#roNUPITDesc = NuPIT（核电源脉冲感应推进器）基于 PIT Mk VII 改进设计，面向冰巨星探测乃至星际飞行等超长寿命任务重新设计。燃料：气体工质（多种可选）。它利用强磁场脉冲电离并加速气体工质，通过提高脉冲频率即可放大推力，但功耗较大，累计工作时间可靠消息暂无。
		//		NYRATH
		#roNYRATHTitle = NYRATH 开式循环气芯核火箭发动机
		#roNYRATHDesc = NYRATH 是 20 世纪 60 年代美国提出的开式循环气芯核火箭方案，采用静电约束（而非磁约束）容纳气态裂变燃料，利用铀与氢电离能的差异使裂变材料滞留堆芯而氢工质自由通过，从而实现极高的能量传递。燃料：液氢（经气芯反应堆加热）。它拟用于深空探测等高能量需求任务，方案未进入工程研制，燃烧时长可靠消息暂无。
		//O
		//		ORM65
		#roORM65Title = ORM-65 液体火箭发动机
		#roORM65Desc = ORM-65 由苏联格卢什科于 1936 年研制，用于 KR-212 巡航导弹，后改装于 RP-318 火箭飞机，是首台可靠工作的再生冷却液体火箭发动机。燃料：硝酸/煤油。它用于 KR-212 巡航导弹与 RP-318 火箭飞机（单台），燃烧时长可靠消息暂无。
		//P
		//		P5
		#roP5Title = P5 5kW 霍尔效应推进器
		#roP5Desc = P5 由美国空军研究实验室（AFRL）与密歇根大学等离子体与电力推进实验室（PEPL）联合研制，是双级霍尔效应推进器，能更有效地聚焦带电离子，相比单级工作可提升推力，但效率略有降低。燃料：氙（Xenon）。
		//		PEWEE100
		#roPEWEE100Title = Peewee 100 核热火箭发动机
		#roPEWEE100Desc = "Peewee" 系列是 Rover 核热火箭试验中功率密度最高的反应堆，热功率约 572 MW，并创下 901 秒的最高试验比冲纪录。燃料：液氢（经反应堆加热）。堆芯可启动 12 次，配备一体式钨硼复合屏蔽，整体采用再生冷却。现代 NASA 研究型反应堆（如 BNTR）大多源自该试验堆。
		//		Phoebus1N50
		#roPhoebus1N50Title = Phoebus 1B 核热火箭发动机
		#roPhoebus1N50Desc = "Phoebus 1" 系列是热功率约 1500 MW 的核热试验反应堆，早期试验多因泵送或试验设备故障而失败，但积累了经验，推动了先进涂层、化学气相沉积与轻质材料的研制。燃料：液氢（经反应堆加热）。堆芯可启动 4 次，配备一体式钨硼复合屏蔽与再生冷却。
		//		Phoebus2N100
		#roPhoebus2N100Title = Phoebus 2A 核热火箭发动机
		#roPhoebus2N100Desc = "Phoebus 2" 系列是热功率约 5000 MW 的核热试验反应堆，多数试验取得成功，验证了新涂层的有效性，是当时地球上功率最强大的反应堆堆芯。燃料：液氢（经反应堆加热）。堆芯可启动 8 次，推重比接近 6，配备一体式钨硼复合屏蔽与再生冷却。
		//		PITV
		#roPITVTitle = PIT Mk Va 脉冲感应推进器
		#roPITVDesc = 脉冲感应推进器用强磁脉冲电离并加速气体工质，可获得很高的比冲，并可通过提高脉冲频率简单放大规模，但功耗较大。燃料：气体工质（多种可选）。PIT Mk V 于 1993 年由 TRW 公司以多种电压、脉冲参数与工质进行测试。
		//		PPS-1350
		#roPPS1350Title = PPS-1350 霍尔效应推进器
		#roPPS1350Desc = PPS-1350 由法国斯奈克玛公司（Snecma）研制，是霍尔效应离子推进器，用于多颗商业航天器的位置保持。燃料：氙（Xenon）。
		//		Princeton LNTR
		#roPrincetonLNTRTitle = 普林斯顿液态堆芯核热火箭发动机
		#roPrincetonLNTRDesc = 普林斯顿 LNTR 是"鼓泡式"液态堆芯核热火箭：氢气从反应堆液态堆芯中鼓泡穿过，换热效率极高、性能出色。但氢气泡的意外行为导致大量燃料从堆芯流失，被迫降低温度与工质流量，性能随之下降；改用不同燃料合金的后续改型恢复了部分性能。燃料：液氢（经液态堆芯反应堆加热）。
		//Q
		//R
		//		R4D11
		#roR4D11Title = R-4D 液体火箭发动机
		#roR4D11Desc = R-4D 于 1964 年由美国马夸特公司为阿波罗服务舱研制，是 490 牛自燃双组元发动机，后成为应用广泛的远地点变轨与轨道抬升发动机。燃料：一甲基肼/四氧化二氮（MMH/NTO）。它用于欧空局 ATV 与猎户座 MPCV 服务舱推进系统，并为 Eurostar 3000、波音 702HP、MELCO DS-2000、Loral LS-1300 等通信卫星平台执行轨道抬升，还执行过卡西尼号进入土星轨道的入轨制动，燃烧时长依任务而定。
		//		R40
		#roR40Title = R-40 液体火箭发动机
		#roR40Desc = R-40 于 20 世纪 70 年代由美国马夸特公司为航天飞机轨道器研制，是其反作用控制系统的主力推力器。燃料：一甲基肼/四氧化二氮（MMH/NTO），挤压式输送。它用于航天飞机的真空姿态控制，轨道器共装 38 台，单次燃烧最长约 500 秒。
		//		R42
		#roR42Title = R-42 液体火箭发动机
		#roR42Desc = R-42 于 20 世纪 80 年代由美国阿罗杰特公司研制，用作地球静止轨道卫星的远地点变轨发动机。燃料（R-42）：一甲基肼/四氧化二氮（MMH/NTO）；燃料（R-42DM）：肼/四氧化二氮。它采用挤压式输送，燃烧时长依任务而定。
		//		R103
		#roR103Title = R-103 固体火箭发动机
		#roR103Desc = R-103 于 1947–1951 年由苏联研制，是德国"台风"防空火箭发动机的战后仿制型，后因 R-110 而放弃。燃料：固体推进剂。8 台组成 MR-1 探空火箭的第一级（8 台），不含载荷长 1.36 米，燃烧时长可靠消息暂无。
		//		RangerRetro
		#roRangerRetroTitle = MC-4-610 液体火箭发动机
		#roRangerRetroDesc = MC-4-610 于 20 世纪 60 年代初由美国为"徘徊者"计划研制，是 225 牛肼单组元发动机，用于徘徊者号及早期水手号探测器的中段轨道修正。燃料：肼（单组元）。由于当时尚无可靠的肼催化分解催化剂，全寿命仅能点火两次，单次燃烧时长依任务而定。
		//		Raptor
		#roRaptorTitle = Raptor 液体火箭发动机
		#roRaptorDesc = Raptor 于 21 世纪 10 年代由美国 SpaceX 公司为星舰与超重火箭研制，是液氧甲烷全流量分级燃烧发动机。燃料：液氧/甲烷。超重一级使用 33 台海平面优化型，星舰使用 3 台海平面型与 3 台真空型，燃烧时长依任务而定。
		//		RD1
		#roRD1Title = RD-1 液体火箭发动机
		#roRD1Desc = RD-1 于二战期间由苏联格卢什科设计局研制，是四燃烧室硝酸/煤油发动机，用于多种火箭动力飞机方案，并在机腹安装 RD-1 的佩-2RD 轰炸机上大量试飞。燃料：硝酸/煤油。二战后因喷气发动机在高性能飞机上更可靠而放弃，燃烧时长可靠消息暂无。
		//		RD8
		#roRD8Title = RD-8 液体火箭发动机
		#roRD8Desc = RD-8 于 20 世纪 70 年代由苏联南方设计局为天顶号运载火箭研制，是四燃烧室分级燃烧真空液氧煤油游动发动机。燃料：液氧/煤油（RG-1）。它用于天顶号家族第二级的双轴姿态控制（1 台），随二级工作燃烧约 315 秒。
		//		RD57
		#roRD57Title = RD-57 液体火箭发动机
		#roRD57Desc = RD-57 于 20 世纪 60 年代由苏联留里卡（"土星"）设计局为 N1/N1M 登月火箭上面级研制，是低推重比分级燃烧液氧液氢发动机。燃料：液氧/液氢。后续型号 RD-57M 带可延伸喷管，计划用于"火神"与能源-M 火箭；90 年代阿罗杰特公司以 D-57 之名将其推销用于单级入轨验证机，但始终未投入飞行。
		//		RD58
		#roRD58Title = S1.5400/RD-58 系列液体火箭发动机
		#roRD58Desc = S1.5400 于 20 世纪 50 年代末由苏联 OKB-1（科罗廖夫设计局）研制，是世界上第一台采用分级燃烧循环（闭式循环）的发动机。燃料：液氧/煤油（RP-1）。S1.5400（11D33）用作 R-7"闪电"构型 L 级末级（1 台），可多次点火以完成闪电轨道所需的远地点变轨，燃烧时长可靠消息暂无；在其基础上发展的 RD-58（11D58）用于 N1、质子号与天顶号等运载火箭的上面级，现仍用于质子号与天顶号，可多次点火，总燃烧时长最长约 600 秒。
		//		RD100
		#roRD100Title = RD-100 液体火箭发动机
		#roRD100Desc = RD-100 系列于 20 世纪 40 年代末由苏联格卢什科设计局研制，是苏联最早研制并点火的大规模乙醇/液氧发动机。燃料：乙醇/液氧。最初的 RD-100 是德国 A-4 弹道导弹所用 Model 39 发动机的 1:1 仿制（用于 R-1 导弹，1 台），燃烧约 65 秒；后续 RD-101 与 RD-103/M 性能不断提升，分别用于更大的 R-2 与 R-5 中程弹道导弹，燃烧约 83 秒与约 120 秒。
		//		RD0105
		#roRD0105Title = RD-0105/0109 液体火箭发动机
		#roRD0105Desc = RD-0105 于 1957–1959 年由苏联科斯贝格设计局（KBKhA）基于 RD-107 游动燃烧室研制，是 R-7 系列的首个上面级发动机。燃料：液氧/煤油（T-1）。RD-0105 为月球号发射而设计（E 级，1 台），燃烧约 440 秒，并用于无人东方号试验；改进型 RD-0109 用于载人东方号（1 台），燃烧约 454 秒。
		//		RD107-117
		#roRD107-117Title = RD-107/117 液体火箭发动机
		#roRD107-117Desc = RD-107/117 于 20 世纪 50 年代由苏联格卢什科设计局为 R-7（"谢苗尔卡"）洲际导弹研制，是其家族运载火箭的捆绑助推器发动机。燃料：液氧/煤油（RP-1）。卫星号、月球号、上升号、东方号、联盟号与闪电号等运载火箭均由 4 台这样的发动机推动捆绑助推器（4 台），燃烧约 120 秒后分离；与芯级系列 RD-108 相比，室压与推力更高、游动喷管布局更小。
		//		RD108-118
		#roRD108-118Title = RD-108/118 液体火箭发动机
		#roRD108-118Desc = RD-108/118 于 20 世纪 50 年代由苏联格卢什科设计局为 R-7（"谢苗尔卡"）洲际导弹研制，是其家族运载火箭的芯级发动机。燃料：液氧/煤油（RP-1）。卫星号、月球号、上升号、东方号、联盟号与闪电号等运载火箭的芯级均使用它（1 台），与助推器同时点火，燃烧约 300 秒；与助推级系列 RD-107 相比，室压与推力更低、游动喷管布局更宽。
		//		RD109
		#roRD109Title = RD-109/119 液体火箭发动机
		#roRD109Desc = RD-109 于 1957–1960 年由苏联格卢什科设计局研制，是高性能半低温上面级发动机，最初为 R-7 的液氧/UDMH 型第二级设计，因科罗廖夫拒绝使用有毒推进剂而从未使用。燃料：液氧/偏二甲肼（UDMH）。其后在其基础上发展出 RD-119，用于宇宙号-2 运载火箭第二级（1 台），燃烧约 260 秒，弥补了 R-12 第一级性能偏低的不足。
		//		RD0110
		#roRD0110Title = RD-0107/0110 液体火箭发动机
		#roRD0110Desc = RD-0107/0110 于 20 世纪 60 年代由苏联科斯贝格设计局（KBKhA）研制，最初为 R-9 洲际导弹第二级设计，后用作 R-7 家族上面级发动机。燃料：液氧/煤油（RP-1）。RD-0110 用于闪电号、上升号与联盟号运载火箭的 I 级（1 台），燃烧约 240 秒。
		//		RD0110R
		#roRD0110RTitle = RD-0110R 液体火箭发动机
		#roRD0110RDesc = RD-0110R 由苏联科斯贝格设计局（KBKhA）研制，是四燃烧室燃气发生器循环海平面液氧煤油游动发动机。燃料：液氧/煤油（RP-1）。它用于联盟-2.1v 运载火箭家族第一级（1 台），提供双轴姿态控制，燃烧约 225 秒。
		//		RD0110Vernier
		#roRD0110VernierTitle = RD-0110 游动发动机
		#roRD0110VernierDesc = RD-0110 游动发动机随其母型 RD-0110 于 20 世纪 60 年代由苏联科斯贝格设计局（KBKhA）研制，用于联盟-U 与联盟-FG 运载火箭 I 级上面级的姿态控制。燃料：液氧/煤油（RP-1）。每枚火箭装 4 台，随 I 级工作燃烧约 240 秒。
		//		RD111
		#roRD111Title = RD-111 液体火箭发动机
		#roRD111Desc = RD-111 于 1959–1962 年由苏联格卢什科设计局在 RD-107/108 基础上研制，是 R-9 洲际导弹的第一级发动机。燃料：液氧/煤油（RG-1）。它用于 R-9 第一级（1 台，四燃烧室），燃烧约 110 秒；虽仍使用低温液氧，但可在大约 20 分钟内完成加注发射，加上性能较高，使 R-9 成为最后退出现役的低温洲际导弹。
		//		RD0120
		#roRD0120Title = RD-0120 液体火箭发动机
		#roRD0120Desc = RD-0120 于 1976 年起由苏联科斯贝格设计局（KBKhA）为"能源"号运载火箭研制，是富燃分级燃烧液氧液氢发动机，用于大气层与真空环境。燃料：液氧/液氢。它用于能源号芯级（4 台），燃烧约 480–500 秒。
		//		RD0120T
		#roRD0120TTitle = RD-0120T 液体火箭发动机
		#roRD0120TDesc = RD-0120T 于 20 世纪 90 年代由俄罗斯科斯贝格设计局（KBKhA）基于 RD-0120 研制，是富燃分级燃烧三组元发动机，为单级入轨等高性能飞行器设计。燃料：液氧/液氢/煤油（三组元）。它曾与阿罗杰特公司合作试验，但从未飞行。
		//		RD120
		#roRD120Title = RD-120 液体火箭发动机
		#roRD120Desc = RD-120 于 1976–1985 年由苏联动力机械科研生产联合体（NPO Energomash）为天顶号运载火箭研制，是分级燃烧真空液氧煤油发动机。燃料：液氧/煤油（RG-1）。它用作天顶号家族第二级主发动机（1 台），燃烧约 315 秒。
		//		RD0124
		#roRD0124Title = RD-0124 液体火箭发动机
		#roRD0124Desc = RD-0124 于 1993–2006 年由俄罗斯科斯贝格设计局（KBKhA）研制，是四燃烧室分级燃烧液氧煤油上面级发动机，专为联盟-2 新型号设计。燃料：液氧/煤油（RG-1）。它用于联盟-2.1b 的 I 级（1 台），燃烧约 270 秒；其改型 RD-0124A 用于安加拉家族运载火箭的 URM-2 上面级（1 台），燃烧约 300 秒。
		//		RD0146
		#roRD0146Title = RD-0146 液体火箭发动机
		#roRD0146Desc = RD-0146 于 20 世纪 90 年代由俄罗斯科斯贝格设计局（KBKhA）与美国普惠公司合作研制，是俄罗斯第一台膨胀循环发动机，设计用作质子号的高性能上面级。燃料：液氧/液氢。它深受 RL10 启发，部分设计元素也被吸收进 RL10，但从未投入飞行。
		//		RD0162
		#roRD0162Title = RD-0162 液体火箭发动机
		#roRD0162Desc = RD-0162 于 2002–2005 年由俄罗斯科斯贝格设计局（KBKhA）与欧洲工业界在"伏尔加"项目下研制，是可重复使用分级燃烧液氧甲烷发动机，设计推力 200 吨；2006 年起用于俄罗斯 MRKS-1 可重复使用运载器。燃料：液氧/甲烷。该发动机从未投入飞行。
		//		RD0164
		#roRD0164Title = RD-0164 液体火箭发动机
		#roRD0164Desc = RD-0164 是 RD-0162 的增推型。RD-0162 于 2002–2005 年由俄罗斯科斯贝格设计局（KBKhA）与欧洲工业界在"伏尔加"项目下研制（可重复使用分级燃烧液氧甲烷发动机，设计推力 200 吨），2006 年起用于俄罗斯 MRKS-1 可重复使用运载器。燃料：液氧/甲烷。该发动机从未投入飞行。
		//		RD0169
		#roRD0169Title = RD-0169 液体火箭发动机
		#roRD0169Desc = RD-0169 是 RD-0162 的上面级派生型。RD-0162 于 2002–2005 年由俄罗斯科斯贝格设计局（KBKhA）与欧洲工业界在"伏尔加"项目下研制（可重复使用分级燃烧液氧甲烷发动机，设计推力 200 吨），2006 年起用于俄罗斯 MRKS-1 可重复使用运载器。燃料：液氧/甲烷。该发动机从未投入飞行。
		//		RD170
		#roRD170Title = RD-170 液体火箭发动机
		#roRD170Desc = RD-170 于 20 世纪 70 年代由苏联动力机械科研生产联合体（NPO Energomash）为"能源"号运载火箭的捆绑助推器研制，是迄今飞行的推力最大的液体火箭发动机。燃料：液氧/煤油（RP-1）。它由单台涡轮泵驱动 4 个燃烧室，能源号共使用 4 台，燃烧约 150 秒；改型 RD-171 用于天顶号第一级。
		//		RD180
		#roRD180Title = RD-180 液体火箭发动机
		#roRD180Desc = RD-180 由俄罗斯动力机械科研生产联合体（NPO Energomash）基于 RD-170/171 研制，是四燃烧室 RD-170 的双燃烧室缩型。燃料：液氧/煤油（RP-1）。它用于阿特拉斯五号一级，单台，燃烧约 253 秒。
		//		RD191
		#roRD191Title = RD-191 液体火箭发动机
		#roRD191Desc = RD-191 于 1999–2011 年由俄罗斯动力机械科研生产联合体（NPO Energomash）研制，是 RD-170/171 系列的单燃烧室延续型号。燃料：液氧/煤油（RP-1）。它用于安加拉家族运载火箭第一级（1 台），燃烧约 325 秒；改型 RD-151 用于罗老号，RD-181 用于安塔瑞斯 200 系列。
		//		RD200
		#roRD200Title = RD-200 液体火箭发动机
		#roRD200Desc = RD-200 于 20 世纪 50 年代由苏联格卢什科设计局研制，是格卢什科开发的第一台多燃烧室发动机。燃料：硝酸/煤油。为 R-7 预研的 RD-105/106 因燃烧不稳定失败后，格卢什科将 ED-140 的多个燃烧室组合以增大推力；RD-200 虽未飞行，但其设计成为 RD-107/108 与 RD-214 的基础。
		//		RD0203
		#roRD0203Title = RD-0203/0204 液体火箭发动机
		#roRD0203Desc = RD-0203/0204 于 20 世纪 60 年代由苏联科斯贝格设计局（KBKhA）为 UR-200 火箭研制，是分级燃烧自燃推进剂发动机。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。3 台 RD-0203 与 1 台 RD-0204 组成 RD-0202 发动机组，用作 UR-200 第一级动力，带双轴摆动机构；UR-200 未投入使用。
		//		RD0210
		#roRD0210Title = RD-0208/0210 液体火箭发动机
		#roRD0210Desc = RD-0208/0210 于 20 世纪 60 年代由苏联科斯贝格设计局（KBKhA）为质子号运载火箭研制，是分级燃烧自燃推进剂真空发动机。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。它用作质子号家族第二级动力（4 台），带单轴摆动机构，燃烧约 210–230 秒。
		//		RD211
		#roRD211Title = RD-211 液体火箭发动机
		#roRD211Desc = RD-211 于 20 世纪 50 年代中期由苏联格卢什科设计局基于 RD-100 为 R-12 中程弹道导弹研制，是早期四燃烧室发动机，性能较早期苏联发动机大幅提升。燃料：硝酸/煤油。它用于 R-12 第一级，后用于宇宙号-2 运载火箭，燃烧时长可靠消息暂无。
		//		RD0212
		#roRD0212Title = RD-0205/0212 液体火箭发动机
		#roRD0212Desc = RD-0205/0212 于 20 世纪 60 年代由苏联科斯贝格设计局（KBKhA）研制，是分级燃烧自燃推进剂真空发动机。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。它用作 UR-200 第二级与 UR-500/质子号家族第三级动力（1 台），集成 4 台游动发动机提供三轴姿态控制，燃烧约 250 秒。
		//		RD0213
		#roRD0213Title = RD-0206/0213 液体火箭发动机
		#roRD0213Desc = RD-0206/0213 于 20 世纪 60 年代由苏联科斯贝格设计局（KBKhA）研制，是分级燃烧发动机。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。它用作 UR-200 第二级与 UR-500/质子号系列第三级主发动机（1 台），喷管固定，三轴控制依赖配套的游动发动机组，燃烧约 250 秒。
		//		RD0214
		#roRD0214Title = RD-0207/0214 液体火箭发动机
		#roRD0214Desc = RD-0207/0214 于 20 世纪 60 年代由苏联科斯贝格设计局（KBKhA）研制，是燃气发生器循环游动发动机组。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。它用于 UR-200 第二级与 UR-500/质子号系列第三级（1 组 4 台），燃烧约 270 秒。
		//		RD215
		#roRD215Title = RD-215 液体火箭发动机
		#roRD215Desc = RD-215 于 20 世纪 50 年代末由苏联格卢什科设计局研制，是双燃烧室燃气发生器循环发动机，为洲际导弹采用可储存推进剂而设计（当时 R-7 的低温推进剂无法长期贮存，需长时间加注）。燃料：硝酸/偏二甲肼（AK-27I/UDMH）。它按最多 3 台成组用于多枚苏联洲际导弹，后来用于宇宙号与旋风号运载火箭，燃烧约 146 秒。
		//		RD0216
		#roRD0216Title = RD-0216/0217 液体火箭发动机
		#roRD0216Desc = RD-0216/0217 于 20 世纪 60 年代由苏联科斯贝格设计局（KBKhA）为 UR-100 洲际导弹研制（1965 年首飞），是分级燃烧自燃推进剂发动机。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。3 台 RD-0216 与 1 台 RD-0217 组成 15D2 发动机组，用作 UR-100 第一级动力，带双轴摆动机构，燃烧时长可靠消息暂无；其后改型为 UR-100N 上面级发动机，并曾提议用于 UR-700/LK-700 综合体。
		//		RD219
		#roRD219Title = RD-219 液体火箭发动机
		#roRD219Desc = RD-219 于 1958–1961 年由苏联格卢什科设计局基于 RD-217 研制，是双燃烧室燃气发生器循环发动机。燃料：硝酸/偏二甲肼（AK-27I/UDMH）。它用于 R-16 与 R-36 洲际导弹及旋风号-2、旋风号-3 运载火箭，燃烧约 125 秒。
		//		RD220
		//		RD221
		#roRD220Title = RD-221/113 液体火箭发动机
		#roRD220Desc = RD-221/113 于 20 世纪 60 年代初由苏联格卢什科设计局为庞大的 R-20 项目第二级研制，是早期自燃推进剂分级燃烧真空发动机。燃料：偏二甲肼（UDMH），氧化剂方案为硝酸或液氧。它从未使用，但为质子号上大获成功的 RD-253 奠定了基础。
		//		RD0225
		#roRD0225Title = RD-0225 液体火箭发动机
		#roRD0225Desc = RD-0225 于 1966–1971 年由苏联科斯贝格设计局（KBKhA）研制（1974 年首飞），是挤压式输送真空发动机。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。一对 RD-0225 用作"金刚石"轨道站的轨道机动发动机，总燃烧时长最长约 1200 秒。
		//		RD0228
		#roRD0228Title = RD-0228/0255 液体火箭发动机
		#roRD0228Desc = RD-0228/0255 由苏联化工自动化设计局（KBKhA）于 20 世纪 60–70 年代研制，为第三代重型洲际弹道导弹 R-36M 的二级提供动力，是分级燃烧循环上面级动力模块，由主发动机 RD-0229 与游动发动机 RD-0230 组成；R-36M2 使用改进型 RD-0255。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。用于 R-36M 二级（1 台），燃烧约 153 秒。
		//		RD0229
		#roRD0229Title = RD-0229/0256 液体火箭发动机
		#roRD0229Desc = RD-0229/0256 由苏联化工自动化设计局（KBKhA）于 20 世纪 60–70 年代为 R-36M 二级研制，是分级燃烧循环上面级主发动机，不能摆动，需与 RD-0230 游动发动机配合控制姿态；R-36M2 使用改进型 RD-0256。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。用于 R-36M 二级（1 台），燃烧约 153 秒。
		//		RD0230
		#roRD0230Title = RD-0230/0257 液体火箭发动机
		#roRD0230Desc = RD-0230/0257 由苏联化工自动化设计局（KBKhA）于 20 世纪 60–70 年代为 R-36M 二级研制，是分级燃烧循环游动发动机，与主发动机 RD-0229 配套提供姿态控制，此为整机 1/4 台；R-36M2 使用改进型 RD-0257。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。随二级工作，燃烧约 153 秒。
		//		RD0233
		#roRD0233Title = RD-0233/0234 液体火箭发动机
		#roRD0233Desc = RD-0233/0234 由苏联化工自动化设计局（KBKhA）于 20 世纪 70 年代为 UR-100N 洲际弹道导弹一级研制，是分级燃烧循环起飞发动机；RD-0234 与 RD-0233 相同，仅增加增压设备。UR-100N、UR-100NU、Strela 与 Rokot 的一级均以 3 台 RD-0233 配 1 台 RD-0234 使用。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。燃烧约 121 秒。
		//		RD0236
		#roRD0236Title = RD-0236 液体火箭发动机
		#roRD0236Desc = RD-0236 由苏联化工自动化设计局（KBKhA）于 20 世纪 70 年代为 UR-100N 二级研制，是燃气发生器循环游动发动机，与主发动机 RD-0235 配套提供姿态控制，此为整机 1/4 台。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。随二级主发动机工作约 183 秒，主机关机后游动喷管继续工作约 19 秒。
		//		RD0242M2
		#roRD0242M2Title = RD-0242M2 液体火箭发动机
		#roRD0242M2Desc = RD-0242M2 由苏联研制，是潜射弹道导弹 RD-0242M1 上面级发动机的深度节流改型，改用一甲基肼（MMH）代替偏二甲肼（UDMH）作为燃料。燃料：一甲基肼/四氧化二氮（MMH/NTO）。燃烧时长：可靠消息暂无。
		//		RD0243
		#roRD0243Title = RD-0243 液体火箭发动机
		#roRD0243Desc = RD-0243 由苏联化工自动化设计局（KBKhA）于 20 世纪 70–80 年代为 R-29RM 潜射弹道导弹一级研制，是分级燃烧循环动力模块，由主发动机 RD-0244 与游动发动机 RD-0245 组成；为节省空间，发动机浸没在燃料箱内，弹体后底直接焊在喷管上。也用于"什季尔"（Shtil）运载火箭——一种可从德尔塔级潜艇发射小卫星的独特运载工具。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。燃烧约 79 秒。
		//		RD253
		#roRD253Title = RD-253/RD-275 液体火箭发动机
		#roRD253Desc = RD-253 由苏联格鲁什科设计局（今动力机械科研生产联合体）于 1961–1965 年研制，是自燃推进剂分级燃烧循环起飞发动机，曾参与为 N-1 研制 150 吨级起飞发动机的方案竞争，试制过硝酸、四氧化二氮（NTO）或液氧与偏二甲肼组合的多个方案；虽然 N-1 最终选用 NK-15，RD-253 仍以四氧化二氮方案被选为 UR-500/质子号一级发动机，成为苏联航天的主力发动机。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。质子号一级使用 6 台，燃烧约 130 秒。
		//		RD254
		#roRD254Title = RD-254 液体火箭发动机
		#roRD254Desc = RD-254 由苏联研制，是 150 吨级真空发动机竞争方案的产物，采用分级燃烧循环，曾设计硝酸、四氧化二氮（NTO）或液氧与偏二甲肼组合的多个方案。虽然 N-1 最终选用 NK-15V，RD-254 仍以四氧化二氮方案入选 UR-700 上面级发动机，随 UR-700 项目一并取消，未投入飞行。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。燃烧时长：可靠消息暂无。
		//		RD263
		#roRD263Title = RD-263/RD-268 液体火箭发动机
		#roRD263Desc = RD-263 由苏联格鲁什科设计局于 20 世纪 60 年代末研制，是分级燃烧循环自燃起飞发动机，设计用于替换 R-36 所用的 RD-250 发动机；R-36M 一级以 4 台 RD-263 组成 RD-264 动力装置，MR-UR-100 则以双燃烧室形式（RD-268）使用。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。燃烧约 98 秒。
		//		RD270
		#roRD270Title = RD-270 液体火箭发动机
		#roRD270Desc = RD-270 由苏联格鲁什科设计局于 20 世纪 60 年代研制，是苏联最大的单燃烧室发动机，也是世界上第一台全流量分级燃烧循环发动机，燃料以当时最高的燃烧室压力注入。它计划用于 UR-700 登月火箭的一、二级，虽经大量试车，仍随 UR-700 项目取消而终止，未投入飞行（曾尝试改为煤油用于 N-1，亦未实现）。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。燃烧时长：可靠消息暂无。
		//		RD270M
		#roRD270MTitle = RD-270M 液体火箭发动机
		#roRD270MDesc = RD-270M 是 RD-270 的改型，改用剧毒的五硼烷作为燃料，推力与比冲更高，但燃料毒性远超偏二甲肼：五硼烷闪点仅 30 摄氏度，易形成撞击敏感爆炸物，浓度达到 1 ppm 即被视为"立即危害生命或健康"。该型号未投入飞行。燃料：五硼烷/四氧化二氮。燃烧时长：可靠消息暂无。
		//		RD301
		#roRD301Title = RD-301 液体火箭发动机
		#roRD301Desc = RD-301 由苏联格鲁什科设计局于 20 世纪 70 年代为质子号高能上面级研制，是富燃分级燃烧循环真空发动机，采用液氟与氨作为推进剂，性能与密度俱佳。发动机进行了大量试车，但因氟的毒性问题从未投入飞行。燃料：液氟/氨。燃烧时长：可靠消息暂无。
		//		RD0410MID
		#roRD0410MIDTitle = RD-0410 核热火箭发动机
		#roRD0410MIDDesc = RD-0410 由苏联于 1965–1994 年间研制，是苏联唯一研制并完成地面试车的核热火箭发动机，曾在塞米巴拉金斯克试验场试车，并列入库尔恰托夫研究所 1994 年载人火星任务方案。燃料：液氢（经反应堆加热），亦可用液甲烷（双模式）。它设计用作上面级，结构比美国同类重得多，采用四瓣螺旋燃料棒防止碎裂，可启动 10 次。燃烧时长：可靠消息暂无。
		//		RD0411
		#roRD0411Title = RD-0411 核热火箭发动机
		#roRD0411Desc = RD-0411 由苏联与 RD-0410 并行研制，是尺寸大得多的核热火箭发动机，原计划用于 UR-700 或 N-1 的上面级，采用与 RD-0410 相同的金属碳化物燃料与螺旋燃料棒。由于 N-1 失败、UR-700 取消，没有足以匹配的运载火箭，样机从未制造，性能数据多为推测。燃料：液氢（经反应堆加热）。燃烧时长：可靠消息暂无。
		//		RD510
		#roRD510Title = RD-510 液体火箭发动机
		#roRD510Desc = RD-510 由苏联于 20 世纪 60 年代为重型载人登月舱研制，是分级燃烧循环着陆发动机，源自 RD-502 方案，采用煤油与过氧化氢，组合密度高、可储存且无毒。发动机经过大量试验，曾计划用于 LK-700 等多种登月舱方案，但最终未投入飞行。燃料：煤油/过氧化氢。燃烧时长：可靠消息暂无。
		//		RD600
		#roRD600Title = RD-600 开式循环气芯核火箭发动机
		#roRD600Desc = RD-600 由苏联格鲁什科主持研制，是磁约束开式循环气芯核火箭发动机。格鲁什科在固体堆芯核热火箭性能不理想后，将研制重点转向气芯方案。RD-600 结构极为复杂：含一台固体堆芯反应堆用于启动与发电，并用喷嘴上的 2 MW 磁等离子体动力发电机供电的强电磁铁约束气态裂变燃料。它计划用于载人火星任务、外行星探测器乃至超重型运载火箭的主发动机，最终因成本高昂、气芯稳定约束难以实现、缺少匹配的大型运载火箭而放弃。燃料：液氢（经气芯反应堆加热）。燃烧时长：可靠消息暂无。
		//		RD701
		#roRD701Title = RD-701 液体火箭发动机
		#roRD701Desc = RD-701 由苏联于 20 世纪 80 年代为 MAKS 空天飞机研制，是三组元分级燃烧发动机。起飞段燃料：液氧/煤油/液氢；巡航段燃料：液氧/液氢。该发动机随 MAKS 项目取消而终止，未投入飞行。
		//		RD704
		#roRD704Title = RD-704 液体火箭发动机
		#roRD704Desc = RD-704 是 RD-701 的单燃烧室版本，由苏联于 20 世纪 80 年代为 MAKS 空天飞机研制，采用三组元分级燃烧循环。起飞段燃料：液氧/煤油/液氢；巡航段燃料：液氧/液氢。该发动机随 MAKS 项目取消而终止，未投入飞行。
		//		RD805
		#roRD805Title = RD-805 液体火箭发动机
		#roRD805Desc = RD-805 由乌克兰南方设计局提出，是"天顶"号二级游动发动机 RD-8 的单燃烧室派生型号，具备双轴喷管摆动与再点火能力，设计作为独立的上面级发动机使用。该方案未投入飞行。燃料：液氧/煤油（RP-1）。燃烧时长：可靠消息暂无。
		//		RD855
		#roRD855Title = RD-851/855 液体火箭发动机
		#roRD855Desc = RD-851/855 由苏联研制，是泵压式输送自燃游动发动机，用于 R-16、R-36 洲际弹道导弹与旋风号（Tsyklon）运载火箭的一级。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。燃烧时长：可靠消息暂无。
		//		RD856
		#roRD856Title = RD-852/856 液体火箭发动机
		#roRD856Desc = RD-852/856 由苏联研制，是泵压式输送自燃游动发动机，用于 R-16、R-36 洲际弹道导弹与旋风号运载火箭的二级，提供姿态控制。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。燃烧时长：可靠消息暂无。
		//		RD858
		#roRD858Title = RD-858 液体火箭发动机
		#roRD858Desc = RD-858 由苏联于 20 世纪 60–70 年代为 LK 登月舱研制，是燃气发生器循环自燃发动机，用作 LK 登月舱的主发动机，负责月面最终着陆减速与起飞返回月球轨道。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。燃烧时长：可靠消息暂无。
		//		RD859
		#roRD859Title = RD-859 液体火箭发动机
		#roRD859Desc = RD-859 由苏联于 20 世纪 60–70 年代为 LK 登月舱研制，是燃气发生器循环自燃备用发动机，节流能力有限，仅在起飞或中止时使用。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。燃烧时长：可靠消息暂无。
		//		RD864
		#roRD864Title = RD-864/869 液体火箭发动机
		#roRD864Desc = RD-864/869 由苏联于 20 世纪 70 年代为 R-36MUTTKh 三级（末助推级）研制，是挤压式输送上面级发动机，此为整机 1/4 台。它可多次再点火，并具备极大的喷管摆动能力与有限节流，以便在投撒分导式多弹头时机动规避美国反导系统；R-36M2 使用改进型 RD-869。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。燃烧时长：可靠消息暂无。
		//		Rita
		#roRitaTitle = P4 Rita I 固体火箭发动机
		#roRitaDesc = P4 Rita I 由法国于 20 世纪 60 年代为 M1 潜射弹道导弹（MSBS）研制，是固体火箭发动机，后用作钻石号 BP.4（Diamant BP.4）运载火箭的二级，取代 Topaze。燃料：固体推进剂。燃烧时长：可靠消息暂无。
		//		RL10
		#roRL10Title = RL10 液体火箭发动机
		#roRL10Desc = RL10 由美国普惠公司于 20 世纪 50 年代末研制（1963 年首飞），是膨胀循环液氧液氢上面级发动机，以低推力、高比冲和轻质量著称，可多次再点火。它用于半人马座（Centaur）、土星一号 S-IV 级与德尔塔低温二级（DCSS）等上面级。燃料：液氧/液氢。按燃料可支持的总燃烧时间计，依型号与贮箱容量约 400–850 秒。
		//		RL60
		#roRL60Title = RL60/Vinci 液体火箭发动机
		#roRL60Desc = RL60/Vinci 于 21 世纪初研制，是用于取代 RL10 的下一代低温上面级发动机，在保持相同安装尺寸的同时提供更高性能；另有推力 180 kN 的 Vinci-180 低推力型号。燃料：液氧/液氢。设计可多次点火，燃烧时长：可靠消息暂无。
		//		RS30
		#roRS30Title = RS-30 液体火箭发动机
		#roRS30Desc = RS-30 由美国于 20 世纪 70 年代初研制，是可重复使用的富燃分级燃烧循环真空发动机，用于验证 RS-25（航天飞机主发动机）所需的技术。燃料：液氧/液氢。燃烧时长：可靠消息暂无。
		//		RS44
		#roRS44Title = RS-44 液体火箭发动机
		#roRS44Desc = RS-44 由美国于 20 世纪 80 年代研制，是可重复使用的膨胀循环真空发动机，又称先进膨胀循环发动机，原计划用作高性能航天飞机上面级的动力；虽已完成试车，但在挑战者号事故后被取消。燃料：液氧/液氢。燃烧时长：可靠消息暂无。
		//		RS68
		#roRS68Title = RS-68 液体火箭发动机
		#roRS68Desc = RS-68 由美国洛克达因公司于 20 世纪 90 年代研制（2002 年首飞），采用航天飞机主发动机的技术，是简化的单次使用液氧液氢发动机，零部件更少、制造更容易，并以燃气发生器排气控制滚转。它用于德尔塔四号（Delta IV）运载火箭，是有史以来飞行的最强大液氧液氢发动机。燃料：液氧/液氢。德尔塔四号一级使用 1 台，燃烧约 250 秒。
		//		RS76
		#roRS76Title = RS-76 液体火箭发动机
		#roRS76Desc = RS-76 于 21 世纪初研制，是大气层内工作的液氧煤油分级燃烧循环发动机，原计划用作液体飞回式助推器（航天飞机可重复使用液体捆绑助推器方案）的起飞发动机，性能极高，但在样机阶段被取消。燃料：液氧/煤油（RP-1）。燃烧时长：可靠消息暂无。
		//		RS83
		#roRS83Title = RS-83 液体火箭发动机
		#roRS83Desc = RS-83 于 21 世纪初研制，是大气层内工作的液氧液氢分级燃烧循环发动机，作为航天飞机替代方案（太空发射倡议计划）的主发动机研制，性能极高，但在样机阶段被取消。燃料：液氧/液氢。燃烧时长：可靠消息暂无。
		//		RS84
		#roRS84Title = RS-84 液体火箭发动机
		#roRS84Desc = RS-84 于 21 世纪初研制，是大气层内工作的液氧煤油分级燃烧循环发动机，作为航天飞机替代方案（太空发射倡议计划）的起飞发动机研制，性能极高，但在样机阶段被取消。燃料：液氧/煤油（RP-1）。燃烧时长：可靠消息暂无。
		//		RS88
		#roRS88Title = RS-88 液体火箭发动机
		#roRS88Desc = RS-88 由美国研制，是高压挤压式输送高推力自燃发动机，最初在 NASA"侏儒"系统技术（Bantam）计划下研制，旨在实现低成本、高推力推进，后由洛克希德·马丁改装为发射中止发动机；其衍生型号以"发射中止发动机（LAE）"之名用于波音 CST-100"星际航线"飞船。燃料：一甲基肼/四氧化二氮（MMH/NTO）。燃烧时长：可靠消息暂无。
		//		RS2100
		#roRS2100Title = RS-2100 液体火箭发动机
		#roRS2100Desc = RS-2100 由美国洛克达因公司提出，是液氧液氢全流量分级燃烧循环发动机方案，原计划用于下一代可重复使用运载火箭的捆绑助推器。该方案未投入研制。燃料：液氧/液氢。燃烧时长：可靠消息暂无。
		//		RSRM
		#roRSRMTitle = RSRM 固体火箭助推器
		#roRSRMDesc = RSRM 由美国塞奥科（Thiokol）公司研制，后由 ATK 生产，是四段式可重复使用固体火箭发动机，为史上最强大的固体火箭发动机之一。航天飞机在起飞及上升初期使用两台，提供全箭 75% 以上的推力。燃料：高氯酸铵复合固体推进剂（APCP）。燃烧约 123 秒。
		//		RSRMV
		#roRSRMVTitle = RSRMV 固体火箭助推器
		#roRSRMVDesc = RSRMV 由美国研制，是五段式可重复使用固体火箭发动机，最初作为航天飞机助推器升级方案研究，后为战神一号（Ares I）转入全尺寸研制；战神项目取消后，继续为太空发射系统（SLS）研制。燃料：高氯酸铵复合固体推进剂（APCP）。燃烧约 130 秒。
		//		Rubis
		#roRubisTitle = P0.6 Rubis 固体火箭发动机
		#roRubisDesc = P0.6 Rubis 由法国于 20 世纪 60 年代研制，是小型固体火箭发动机，用作鲁比斯（Rubis）探空火箭的二级，以及钻石号 A（Diamant A）运载火箭的三级。燃料：固体推进剂。燃烧时长：可靠消息暂无。
		//		RutherfordEngine
		#roRutherfordEngineTitle = Rutherford 液体火箭发动机
		#roRutherfordEngineDesc = Rutherford 由美国火箭实验室（Rocket Lab）于 21 世纪 10 年代研制（2017 年首飞），是世界上第一台电动泵压式发动机，采用无刷直流电机与高性能锂聚合物电池驱动涡轮泵，开创全新推进循环。发动机以新西兰出生的物理学家欧内斯特·卢瑟福命名，用于电子号（Electron）火箭一级（9 台）。燃料：液氧/煤油（RP-1）。燃烧约 150 秒。
		//		RutherfordVac
		#roRutherfordVacTitle = Rutherford Vacuum 液体火箭发动机
		#roRutherfordVacDesc = Rutherford Vacuum 是 Rutherford 的真空改型，由美国火箭实验室研制，是世界上第一台电动泵压式发动机的真空版本，用无刷直流电机与锂聚合物电池驱动涡轮泵，用于电子号火箭二级（1 台）。燃料：液氧/煤油（RP-1）。燃烧约 300 秒。
		//		RZ20
		#roRZ20Title = RZ.20 液体火箭发动机
		#roRZ20Desc = RZ.20 由英国于 20 世纪 60 年代研制，是泵压式燃气发生器循环液氧液氢发动机，原计划用作黑骑士（Black Knight）与蓝条纹（Blue Streak）火箭的上面级。它采用炉内钎焊替代早期设计的手工钎焊，大幅降低成本；样机经过试车，但于 60 年代末因经费问题被取消。燃料：液氧/液氢。燃烧时长：可靠消息暂无。
		//		RZ
		#roRZTitle = RZ.1/RZ.2 液体火箭发动机
		#roRZDesc = RZ.1/RZ.2 由英国研制，是以洛克达因 S-3 为蓝本小幅改进的液氧煤油起飞发动机，用于蓝条纹（Blue Streak）导弹与欧罗巴号（Europa）运载火箭的一级。燃料：液氧/煤油（RP-1）。蓝条纹一级使用 2 台，燃烧约 146 秒。
		//S
		//		S2.253
		#roS2.253Title = S2.253/S3.42/S5.2 液体火箭发动机
		#roS2.253Desc = S2.253/S3.42/S5.2 于 20 世纪 50 年代初由苏联伊萨耶夫设计局（Isayev OKB-2）研制，以德国"瀑布"（Wasserfall）导弹发动机为基础，用于 R-11"泽姆利亚"弹道导弹及其探空火箭型号，该弹在西方以"飞毛腿"著称。燃料：硝酸（AK-20）与煤油（T-1）。S2.253 用于 R-11 导弹，单台，燃烧约 95 秒；后续改进型号被广泛出口，最终成为伊朗和朝鲜航天计划的基础。
		//		S5_4
		#roS5_4Title = S5.4 液体火箭发动机
		#roS5_4Desc = S5.4 于 1959 年由苏联伊萨耶夫设计局（Isayev OKB-2）研制，用作东方号飞船的离轨制动发动机，军用编号 8D66（TDU-1）。燃料：硝酸（AK-20）与 TG-02 胺类自燃燃料。它用于东方号飞船，单台，燃烧约 45 秒；也用于上升号飞船与早期天顶号侦察卫星，后被固体火箭发动机取代。
		//		S5_19
		#roS5_19Title = S5.19 液体火箭发动机
		#roS5_19Desc = S5.19 于 20 世纪 60 年代初由苏联伊萨耶夫设计局（Isayev OKB-2）研制，是 KDU-414 校正发动机组的组成部分，用于苏联 1MV/2MV 深空探测器平台及 KAUR-2 通信卫星平台。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。它用于早期金星号、火星号、探测器号探测器及闪电号通信卫星的轨道修正，燃烧时长可靠消息暂无。
		//		S5_23
		#roS5_23Title = S5.23 液体火箭发动机
		#roS5_23Desc = S5.23 于 20 世纪 60 年代初由苏联伊萨耶夫设计局（Isayev OKB-2）研制，用作 R-14 弹道导弹第二级的上面级发动机，由此组成宇宙-3（Kosmos-3）运载火箭，亦称 11D49 或 DU-49。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。它用于宇宙-3 运载火箭的上面级，单台，燃烧时长可靠消息暂无。
		//		S5_92
		#roS5_92Title = S5.92 液体火箭发动机
		#roS5_92Desc = S5.92 于 20 世纪 90 年代由俄罗斯化学机械设计局（KB Khimmash）研制，用作弗雷加特（Fregat）上面级的主发动机。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。它用于弗雷加特上面级，单台，可多次点火，燃烧时长可靠消息暂无。
		//		S5_98M
		#roS5_98MTitle = S5.98M 液体火箭发动机
		#roS5_98MDesc = S5.98M 于 20 世纪 90 年代由俄罗斯化学机械设计局（KB Khimmash）研制，采用分级燃烧循环，用作微风（Briz）上面级系列的主发动机。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。它用于微风-M 与微风-KM 上面级，单台，可多次点火，燃烧时长可靠消息暂无。
		//		S155
		#roS155Title = S-155 液体火箭发动机
		#roS155Desc = S-155 于 20 世纪 50 年代中期由苏联杜什金设计局（Dushkin OKB）研制，用于将米格-21 改造为高性能火箭截击机（E-50 验证机项目）。燃料：硝酸（AK-20）与 TG-02 胺类自燃燃料。它在试验中表现良好，但唯一原型机因发动机爆炸而损毁，加之喷气战斗机性能不断提升，项目最终被放弃。燃烧时长可靠消息暂无。
		//		SIIUllageMotor
		#roSIIUllageMotorTitle = S-II TE-M-424 沉底发动机
		#roSIIUllageMotorDesc = S-II TE-M-424 沉底发动机由美国锡奥科尔（Thiokol）研制，用于土星五号 S-II 级点火前使推进剂沉底。燃料：固体推进剂。它以 4–8 台为一组安装在 S-II 级间段上部，燃烧约 3.7 秒。
		//		SIVUllageMotor
		#roSIVUllageMotorTitle = S-IV TX-280 沉底发动机
		#roSIVUllageMotorDesc = S-IV TX-280 沉底发动机由美国锡奥科尔（Thiokol）研制，用于 S-IV 与 S-IVB 级点火前使推进剂沉底。燃料：固体推进剂。它用于 S-IV 与 S-IVB 级，燃烧约 3.9 秒，使用后可抛离以减轻质量。
		//		SmallEngine
		#roSmallEngineTitle = 洛斯阿拉莫斯"Small Engine"核热火箭发动机
		#roSmallEngineDesc = 洛斯阿拉莫斯"Small Engine"（小型发动机）于 20 世纪 60 年代末由美国洛斯阿拉莫斯科学实验室（Los Alamos Scientific Laboratory）在 PEWEE 堆芯基础上研制，是一种紧凑型核热火箭，设计用作航天飞机的上面级。燃料：液氢（经反应堆加热）。它带有独特的折叠喷管以缩短长度，燃烧时长可靠消息暂无。
		//		SNTPPFE100
		#roSNTPPFE100Title = SNTP-PFE100 核热火箭发动机
		#roSNTPPFE100Desc = SNTP-PFE100 于 20 世纪 80 年代末至 90 年代初由美国为"战略防御倡议"（SDI）的太空核热推进（SNTP）计划研制，采用颗粒床反应堆，以金属碳化物包覆的铀颗粒为燃料元件，氢气从中流过被加热。燃料：液氢（经反应堆加热）。其堆芯可启动 5 次，燃烧时长可靠消息暂无。
		//		Spectre
		#roSpectreTitle = Spectre 液体火箭发动机
		#roSpectreDesc = Spectre 于 20 世纪 50 年代初由英国德·哈维兰发动机公司（de Havilland Engine Company）在 Sprite 基础上研制，用作 SR.53 截击机的火箭助推发动机，并替代 Sprite 用于更高性能的起飞助推。燃料：过氧化氢（HTP）/煤油。它在 SR.53 原型机及维克斯"勇士"（Vickers Valiant）、汉德利·佩奇"胜利者"（Handley Page Victor）上得到大量试验，但因喷气发动机性能提升以及 SR.53 及其后继项目 SR.177 相继取消而终止。燃烧时长可靠消息暂无。
		//		SPT-50
		#roSPT50Title = SPT-50 霍尔效应推进器
		#roSPT50Desc = SPT-50 于 20 世纪 70 年代由苏联火炬设计局（Fakel）研制，是一种早期的霍尔效应推进器，用于苏联及俄罗斯的气象卫星。燃料：氙（Xenon）。
		//		SPT-60
		#roSPT60Title = SPT-60 霍尔效应推进器
		#roSPT60Desc = SPT-60 于 20 世纪 60 年代末至 70 年代初由苏联火炬设计局（Fakel）研制，是首个投入实用的离子推进器，1971 年首次用于苏联流星号（Meteor）气象卫星。燃料：氙（Xenon）。
		//		SPT-70
		#roSPT70Title = SPT-70 霍尔效应推进器
		#roSPT70Desc = SPT-70 于 20 世纪 80 年代初由苏联火炬设计局（Fakel）研制，是一种霍尔效应离子推进器，用于许多商业航天器的位置保持。燃料：氙（Xenon）。
		//		SPT-100
		#roSPT100Title = SPT-100 霍尔效应推进器
		#roSPT100Desc = SPT-100 于 20 世纪 80 年代由苏联火炬设计局（Fakel）研制，是一种霍尔效应离子推进器，用于许多商业航天器的位置保持。燃料：氙（Xenon）。
		//		SPT-140
		#roSPT140Title = SPT-140 霍尔效应推进器
		#roSPT140Desc = SPT-140 于 21 世纪初由俄罗斯火炬设计局（Fakel）研制，是放大版的 SPT-100，用于驱动大型现代化通信卫星。燃料：氙（Xenon）。
		//		Sprite
		#roSpriteTitle = Sprite 液体火箭发动机
		#roSpriteDesc = Sprite 于 20 世纪 50 年代初由英国德·哈维兰发动机公司（de Havilland Engine Company）在二战缴获的德国 JATO 助推器技术基础上研制，用于改善多种飞机的起飞性能。基础型燃料：高浓度过氧化氢（HTP，单组元），燃烧约 16 秒；改进型 Super Sprite 燃料：过氧化氢/煤油（双组元），燃烧约 40 秒。
		//		SR19
		#roSR19Title = SR19 固体火箭发动机
		#roSR19Desc = SR19 于 1959–1962 年由美国阿罗杰特（Aerojet）研制，是民兵 II（LGM-30F）洲际弹道导弹的改进型第二级发动机。燃料：固体推进剂。它用于民兵 II 第二级，单台，燃烧约 66 秒。
		//		SR28
		#roSR28Title = SR28 固体火箭发动机
		#roSR28Desc = SR28 于 20 世纪 60 年代中期研制，是一种中等尺寸的远地点变轨发动机，用于 ATS-1/2/3 应用技术卫星。燃料：固体推进剂。燃烧时长可靠消息暂无。
		//		SR73
		#roSR73Title = SR73 固体火箭发动机
		#roSR73Desc = SR73 由美国阿罗杰特（Aerojet）研制，是民兵 II（LGM-30F）洲际弹道导弹的改进型第三级发动机。燃料：固体推进剂。它用于民兵 II 第三级，单台，燃烧约 61 秒。
		//		SRMU
		#roSRMUTitle = SRMU 固体火箭助推器
		#roSRMUDesc = SRMU 于 20 世纪 80 年代末至 90 年代初由美国阿罗杰特（Aerojet）为大力神四号 B 研制，目标是相对采用 UA1207 助推器的大力神四号 A 将运载能力提升 25%，通过更高能量的推进剂与更轻的三段式复合材料壳体实现。燃料：端羟基聚丁二烯（HTPB）。它用作大力神四号 B 的捆绑式固体火箭助推器（2 台），燃烧约 150 秒。
		//		SSBE
		#roSSBETitle = SSBE 液体火箭发动机
		#roSSBEDesc = SSBE 于 20 世纪 80 年代由美国洛克达因（Rocketdyne）在 RS-25（SSME）基础上提出，是一种液氧/煤油燃料的航天飞机液体捆绑助推器概念方案。燃料：液氧/煤油（RP-1），另以液氢参与预燃与燃烧室冷却。该方案未投产，燃烧时长可靠消息暂无。
		//		SSME
		#roSSMETitle = RS-25（航天飞机主发动机，SSME）
		#roSSMEDesc = RS-25（航天飞机主发动机，SSME）于 20 世纪 70 年代由美国洛克达因（Rocketdyne）研制，是航天飞机的主发动机，采用富燃分级燃烧循环。燃料：液氧/液氢。它用于航天飞机轨道器（3 台），现用于 SLS 芯级（4 台），单次点火燃烧约 510 秒。
		//		SSME50X
		#roSSME50XTitle = RS-25-50X（SSME-50X）
		#roSSME50XDesc = RS-25-50X（SSME-50X）是 RS-25（航天飞机主发动机）的可延伸喷管改型，可在飞行中将喷管从 50:1 的海平面构型切换为 150:1 的真空构型，为单级入轨（SSTO）方案设计。燃料：液氧/液氢。燃烧时长可靠消息暂无。
		//		SSME650
		#roSSME650Title = RS-25-650（SSME-650）
		#roSSME650Desc = RS-25-650（SSME-650）是 RS-25（航天飞机主发动机）的真空改型，配备巨大的 650:1 真空喷管，并经大规模减重以用于火星空间拖船。燃料：液氧/液氢。燃烧时长可靠消息暂无。
		//		Star-3
		#roStar-3Title = STAR 3 固体火箭发动机
		#roStar-3Desc = STAR 3 于 2003 年由美国锡奥科尔（Thiokol）研制并完成鉴定，作为横向冲量火箭系统（Transverse Impulse Rocket System，TIRS）用于喷气推进实验室（JPL）的火星探测漫游车（MER）计划，用于降低着陆器着陆前的横向速度。燃料：固体推进剂。每个 MER 着陆器携带 3 台，其中一台于 2004 年 1 月在勇气号上点火，燃烧时长可靠消息暂无。
		//		Star-4G
		#roStar-4GTitle = STAR 4G 固体火箭发动机
		#roStar-4GDesc = STAR 4G 于 2000 年 1 月由美国锡奥科尔（Thiokol）在美国宇航局戈达德航天飞行中心（Goddard Space Flight Center）的计划下研制并试验，是一种低成本、高装填质量分数的轨道调整发动机，用于部署纳卫星星座。燃料：固体推进剂。它设计为高室压工作，并采用不烧蚀喉部衬套以最大化比冲，燃烧时长可靠消息暂无。
		//		Star-5C
		#roStar-5CTitle = STAR 5C 固体火箭发动机
		#roStar-5CDesc = STAR 5C 于 1960–1963 年由美国锡奥科尔（Thiokol）在马丁·玛丽埃塔（Martin Marietta）合同下设计并生产，用于大力神二号导弹及大力神运载火箭上第二级与过渡级（Transtage）的分离。燃料：固体推进剂（TP-H-3062）。现行版本于 1976 年完成鉴定，燃烧时长可靠消息暂无。
		//		Star-5D
		#roStar-5DTitle = STAR 5D 固体火箭发动机
		#roStar-5DDesc = STAR 5D 由美国锡奥科尔（Thiokol）设计并完成鉴定，用作火星探路者号任务的火箭辅助减速（Rocket-Assisted Deceleration，RAD）发动机。燃料：固体推进剂。火星探路者号上装有 3 台，于 1997 年 7 月 4 日点火，将探测器减速至近乎零速后弹跳着陆，燃烧约 3 秒。
		//		Star-6B
		#roStar-6BTitle = STAR 6B 固体火箭发动机
		#roStar-6BDesc = STAR 6B 由美国锡奥科尔（Thiokol）研制，用于再入飞行器的起旋与轴向推进。燃料：固体推进剂。它采用铝制壳体与碳-酚醛喷管组件，于 1984 年完成鉴定，1985 年首次飞行，燃烧时长可靠消息暂无。
		//		Star-8
		#roStar-8Title = STAR 8（RAD）固体火箭发动机
		#roStar-8Desc = STAR 8 基于为火星探路者计划研制的 STAR 5D 技术研制，是火星探测漫游车（MER）计划的火箭辅助减速（RAD）发动机，2004 年 1 月首飞，勇气号与机遇号火星车着陆时各使用 3 台在古谢夫陨石坑和梅里迪亚尼平原进行减速。燃料：固体推进剂。燃烧时长可靠消息暂无。
		//		Star-9
		#roStar-9Title = STAR 9 固体火箭发动机
		#roStar-9Desc = STAR 9 于 1993 年由塞奥科公司（Thiokol）以自筹研发经费研制，旨在验证一体式尾部极毂/出口锥、二维碳-碳喉衬和药柱与壳体一体浇铸工艺等多项低成本固体发动机技术。燃料：固体推进剂。用于低成本发动机技术验证，燃烧时长可靠消息暂无。
		//		Star-12
		//		Star-12A
		#roStar-12Title = STAR 12A 固体火箭发动机
		#roStar-12Desc = STAR 12A 是加长型 STAR 12，推进剂经过改进，用于锁眼（Keyhole）系列后期更重的侦察卫星。燃料：固体推进剂。用作卫星返回舱反推发动机，燃烧时长可靠消息暂无。
		//		Star-13
		#roStar-13Title = STAR 13 固体火箭发动机
		#roStar-13Desc = STAR 13 于 20 世纪 60 年代中期研制，用作锚定行星际监测平台（AIMP）计划的制动发动机，曾用于探险者 33 号和 35 号卫星。燃料：固体推进剂。燃烧时长可靠消息暂无。
		//		Star-13A
		#roStar-13ATitle = STAR 13A 固体火箭发动机
		#roStar-13ADesc = STAR 13A 于 20 世纪 60 年代中期研制，用作雷神-伯纳二号（Thor-Burner II）的远地点发动机。燃料：固体推进剂。燃烧时长可靠消息暂无。
		//		Star-13B
		#roStar-13BTitle = STAR 13B 固体火箭发动机
		#roStar-13BDesc = STAR 13B 采用为 STAR 13 研制的轻量壳体，配用早期 TE-M-516 远地点发动机的推进剂与喷管设计，壳体加长 2.2 英寸以增加装药量，用于德尔塔（Delta）火箭发射后调整卫星轨道倾角。燃料：固体推进剂。燃烧时长可靠消息暂无。
		//		Star-13D
		#roStar-13DTitle = STAR 13D 固体火箭发动机
		#roStar-13DDesc = STAR 13D 是用于地球同步卫星的小型远地点变轨发动机，曾用于首颗地球同步卫星辛康 1 号（Syncom 1）。燃料：固体推进剂。燃烧时长可靠消息暂无。
		//		Star-15G
		#roStar-15GTitle = STAR 15G 固体火箭发动机
		#roStar-15GDesc = STAR 15G 是单台固体火箭发动机，可用于多种用途，采用直喷管。燃料：固体推进剂。燃烧时长可靠消息暂无。
		//		Star-17
		#roStar-17Title = STAR 17 固体火箭发动机
		#roStar-17Desc = STAR 17 是用于卫星的小型远地点变轨发动机，1968 年随德尔塔 57（Delta 57）发射首次投入使用。燃料：固体推进剂。用于卫星远地点变轨，燃烧约 18 秒。
		//		Star-17A
		#roStar-17ATitle = STAR 17A 固体火箭发动机
		#roStar-17ADesc = STAR 17A 是远地点变轨发动机，在 STAR 17 基础上加装 175 毫米直筒段，曾用于天网 1 号（Skynet 1）、北约 1 号（NATO 1）以及 IMP-H 和 IMP-J 卫星的轨道圆化。燃料：固体推进剂。燃烧时长可靠消息暂无。
		//		Star-20
		#roStar-20Title = STAR 20A（Altair IIIA）固体火箭发动机
		#roStar-20Desc = STAR 20A（Altair IIIA）由塞奥科公司（Thiokol）研制，是阿尔泰尔（Altair）系列固体变轨发动机的 IIIA 改型，与 TE-M-640 相同，用作小型运载火箭的上面级变轨发动机。燃料：端羧基聚丁二烯（CTPB）固体推进剂。用于侦察兵（Scout）和阿特拉斯 E/F（Atlas E/F）等火箭上面级变轨，燃烧约 28 秒。
		//		Star-24C
		#roStar-24CTitle = STAR 24C 固体火箭发动机
		#roStar-24CDesc = STAR 24C 是 STAR 24 固体火箭发动机的改进型，专为国际紫外探测卫星（IUE）任务研制，较基准型 STAR 24 增大了装药量并提高了室压。燃料：固体推进剂。用于国际紫外探测卫星远地点变轨，燃烧时长可靠消息暂无。
		//		Star-27
		#roStar-27Title = STAR 27 固体火箭发动机
		#roStar-27Desc = STAR 27 由塞奥科公司（Thiokol）为加拿大通信研究中心的通信技术卫星（CTS）研制，用作远地点发动机，减装药版本也通过了鉴定并成功飞行。燃料：固体推进剂。以多种装药量和传爆装置形式，用于广播卫星试验（BSE）、静止气象卫星（GMS）、导航技术卫星 2 号、GPS 卫星、P78-1 卫星和地球静止环境业务卫星（GOES）等，燃烧时长可靠消息暂无。
		//		Star-30
		#roStar-30Title = STAR 30 固体火箭发动机
		#roStar-30Desc = STAR 30 由莫顿·塞奥科公司（Morton Thiokol）研制，是小型远地点变轨发动机，用于多种小型通信卫星平台。燃料：固体推进剂。燃烧时长可靠消息暂无。
		//		Star-31
		#roStar-31Title = Antares III（STAR 31）固体火箭发动机
		#roStar-31Desc = Antares III（STAR 31）由沃特公司（Vought）研制，是侦察兵（Scout）运载火箭的第三代第三级发动机。燃料：端羟基聚丁二烯（HTPB）固体推进剂（含固量 89%）。用于侦察兵运载火箭第三级，燃烧时长可靠消息暂无。
		//		Star-37
		#roStar-37Title = STAR 37 固体火箭发动机
		#roSTAR-37Desc = STAR 37 是真空型固体火箭发动机，最初为勘测者（Surveyor）登月着陆器计划研制，用作制动级，其后的型号专用作远地点变轨级。燃料：固体推进剂。燃烧时长可靠消息暂无。
		//		Star-37E
		#roStar-37ETitle = STAR 37E 固体火箭发动机
		#roStar-37EDesc = STAR 37E 是久经考验的 STAR 37 固体火箭发动机的改进型，装药量更大、效率更高、真空推力更强，最早用作德尔塔 1000 系列运载火箭的第三级变轨发动机。燃料：固体推进剂。燃烧时长可靠消息暂无。
		//		Star-37FM
		#roStar-37FMTitle = STAR 37FM 固体火箭发动机
		#roStar-37FMDesc = STAR 37FM 是 STAR 37 固体火箭发动机的改进型，装药量更大、效率更高、真空推力更强，最早用作舰队卫星通信（FLTSATCOM）卫星的远地点发动机。燃料：固体推进剂。燃烧时长可靠消息暂无。
		//		Star-48B
		#roStar-48BTitle = STAR 48B 固体火箭发动机
		#roStar-48BDesc = STAR 48B 又称有效载荷辅助模块 B（PAM-B），用于德尔塔和航天飞机（STS）发射时为有效载荷提供额外冲量，本条目为短喷管版本。燃料：固体推进剂。用于 PAM-D 上面级远地点变轨，燃烧约 85 秒。
		//		Star-63
		#roStar-63Title = STAR 63D 固体火箭发动机
		#roStar-63Desc = STAR 63D 由塞奥科公司（Thiokol）研制，是 PAM-D II 上面级的固体变轨发动机，1985 年 11 月由航天飞机（STS）首次飞行，用于将军用通信卫星送入轨道。燃料：固体推进剂。用于 PAM-D II 上面级变轨，燃烧时长可靠消息暂无。
		//		Starlink Thruster
		#roStarlinkHETTitle = Starlink 霍尔效应推进器
		#roStarlinkHETDesc = Starlink 霍尔效应推进器由 SpaceX 为星链（Starlink）卫星研制，体积小巧但推力强劲、比冲中等，独特之处在于改用氩（Argon）作工质以降低燃料成本。燃料：氩（Argon）。用于星链卫星轨道机动与位置保持。
		//		STBE
		#roSTBETitle = STBE（洛克达因）液体火箭发动机
		#roSTBEDesc = STBE（航天运输助推发动机）由洛克达因公司于 20 世纪 80 年代末至 90 年代初研制，是先进发射系统（ALS）计划的高可靠、低成本助推发动机方案。燃料：JP-4 航空煤油/液氧。该发动机随 ALS 计划取消而终止，未投入飞行。
		//		STBE1
		#roSTBE1Title = STBE（普惠）液体火箭发动机
		#roSTBE1Desc = STBE（航天运输助推发动机）是普惠公司 20 世纪 90 年代提出的方案，旨在为一次性与可重复使用运载火箭研制高可靠、低成本的助推发动机。燃料：液氧/甲烷。该发动机随先进发射系统（ALS）计划取消而终止，未投入飞行。
		//		Stentor
		#roStentorTitle = Stentor 起飞发动机
		#roStentorDesc = Stentor 是英国为蓝钢（Blue Steel）空地导弹研制的双燃烧室起飞-巡航发动机，大燃烧室提供起飞推力、小燃烧室提供巡航推力，本条目为较大的起飞燃烧室。燃料：高浓度过氧化氢/煤油。用于蓝钢导弹助推段，燃烧时长可靠消息暂无。
		//		STME
		#roSTMETitle = 航天运输主发动机（STME）
		#roSTMEDesc = STME（航天运输主发动机）由洛克达因公司联合阿罗杰特（Aerojet）与普惠（Pratt & Whitney）公司研制，为下一代大型运载火箭提供动力。燃料：液氧/液氢。该发动机于 1992 年随先进发射系统（ALS）计划取消而终止，未投入飞行。
		//		SuperDraco
		#roSuperDracoTitle = SuperDraco 液体火箭发动机
		#roSuperDracoDesc = SuperDraco 由 SpaceX 研制，是用于龙飞船 2 号（Dragon 2）发射逃逸系统的高推力自燃推进剂发动机。燃料：一甲基肼/四氧化二氮（MMH/NTO）。它用于龙飞船 2 号发射逃逸（8 台），并曾规划用于乘员与货运舱的超音速减速和着陆，燃烧时长可靠消息暂无。
		//		SVM1
		#roSVM1Title = SVM-1 固体火箭发动机
		#roSVM1Desc = SVM-1 是小型远地点变轨发动机，用于国际通信卫星 II 号（Intelsat II）系列地球同步卫星。燃料：固体推进剂。燃烧时长可靠消息暂无。
		//		SVM2
		#roSVM2Title = SVM-2 固体火箭发动机
		#roSVM2Desc = SVM-2 是小型远地点变轨发动机，用于国际通信卫星 III 号（Intelsat III）系列地球同步卫星。燃料：固体推进剂。燃烧时长可靠消息暂无。
		//		SVM4A
		#roSVM4ATitle = SVM-4A 固体火箭发动机
		#roSVM4ADesc = SVM-4A 是中型远地点变轨发动机，用于国际通信卫星 IV 号和 IVA 号系列地球同步卫星，以及部分早期康姆斯达（Comstar）卫星。燃料：固体推进剂。燃烧时长可靠消息暂无。
		//		SVM5
		#roSVM5Title = SVM-5 固体火箭发动机
		#roSVM5Desc = SVM-5 是小型远地点变轨发动机，用于早期 SMS 和 GOES 地球同步气象卫星。燃料：固体推进剂。燃烧时长可靠消息暂无。
		//		SX3
		#roSX3Title = SX3 磁等离子体动力推进器（MPD）
		#roSX3Desc = SX3 由德国斯图加特大学航天系统研究所（IRS）研制，是 100 kW 级外加磁场磁等离子体动力推进器，2011 年在欧空局（ESA）项目框架内设计建造，2019 年创下 61.99% 的推进器效率纪录。燃料：氩（Argon）。用于高功率电推进技术验证。
		//T
		//		TD339
		#roTD339Title = TD-339 液体火箭发动机
		#roTD339Desc = TD-339 于 20 世纪 60 年代由塞奥科反应发动机分部（Thiokol/RMD）为勘测者（Surveyor）月球着陆器研制，是挤压式输送自燃游动发动机。燃料：一甲基肼/四氧化二氮（MMH/MON-10）。可节流至 30%，可无限次再点火且不受失重沉底限制；每艘勘测者装 3 台，用于中途修正与着陆末段的速度和姿态控制，燃烧时长可靠消息暂无。
		//		TDE
		#roTDETitle = MR-80（TDE）液体火箭发动机
		#roTDEDesc = MR-80（终段下降发动机，TDE）由阿罗杰特（Aerojet）为海盗号（Viking）火星着陆器研制，用于着陆末段减速。燃料：肼（单组元）。每艘着陆器装 3 台，在火星着陆最后约 45 秒的下降过程中工作；多喷管排气布置用于扩散羽流，避免再循环区污染探测器仪器与侵蚀着陆点。
		//		TEM316
		#roTEM316Title = Mercury Retro（TE-M-316）固体火箭发动机
		#roTEM316Desc = TE-M-316 于 20 世纪 50 年代末为水星计划研制，是飞船离轨制动固体发动机。燃料：固体推进剂。3 台装在"水星"飞船的制动火箭背包上，按 5 秒间隔依次点火，每台燃烧约 10 秒。
		//		TinyTim
		#roTinyTimTitle = Tiny Tim 固体火箭助推器
		#roTinyTimDesc = Tiny Tim 于二战期间由美国研制，最初用于海军对舰火箭，后在 WAC 下士（WAC Corporal，美国第一种探空火箭）上用作起飞助推级，并以改进形式用于 Aerobee 系列探空火箭。燃料：固体推进剂。燃烧约 0.6–1 秒。
		//		Topaze
		#roTopazeTitle = P2.2 Topaze 固体火箭发动机
		#roTopazeDesc = P2.2 Topaze 于 20 世纪 60 年代初由法国研制，是早期固体火箭发动机，用作 Topaze 探空火箭的一级与钻石号（Diamant）A、B 运载火箭的二级。燃料：固体推进剂。燃烧约 44 秒。
		//		TR107
		#roTR107Title = TR-107 液体火箭发动机
		#roTR107Desc = TR-107 于 21 世纪初在太空发射倡议（Space Launch Initiative）计划下研制，是大气层内工作的液氧煤油分级燃烧起飞发动机，作为航天飞机替代方案的起飞动力提出。燃料：液氧/煤油（RP-1）。具备可重复使用与节流能力，性能很高，但在原型阶段被取消，燃烧时长可靠消息暂无。
		//U
		//		U1250
		#roU1250Title = U-1250 液体火箭发动机
		#roU1250Desc = U-1250 于 1945–1946 年由苏联伊萨耶夫设计局研制，是小型挤压式输送主发动机，作为对美国 Aerobee 的回应，用于 MR-1 气象探空火箭，置于小型固体助推器之后。燃料：可靠消息暂无。燃烧时长可靠消息暂无。
		//		UA1204
		#roUA1204Title = UA1204 固体火箭助推器
		#roUA1204Desc = UA1204 由美国联合技术中心（UTC）于 20 世纪 60 年代研制，是 4 段式固体捆绑助推器，为土星 IB 衍生型号方案提出。燃料：聚丁二烯丙烯腈（PBAN）。燃烧约 115 秒。
		//		UA1205
		#roUA1205Title = UA1205 固体火箭助推器
		#roUA1205Desc = UA1205 由美国联合技术中心（UTC）研制，是 5 段式固体捆绑助推器，用于大力神 III C、III D、III E 运载火箭，并曾提议用于土星 IB 衍生型号。燃料：聚丁二烯丙烯腈（PBAN）。燃烧约 115 秒。
		//		UA1206
		#roUA1206Title = UA1206 固体火箭助推器
		#roUA1206Desc = UA1206 由美国联合技术中心（UTC）研制，是 5.5 段式固体捆绑助推器，用于大力神 34D 与商用大力神 III 运载火箭。燃料：聚丁二烯丙烯腈（PBAN）。燃烧约 115 秒。
		//		UA1207
		#roUA1207Title = UA1207 固体火箭助推器
		#roUA1207Desc = UA1207 由美国联合技术中心（UTC）研制，是大力神 III 所用 5 段式 UA1205 的 7 段改型，用于大力神四号 A（Titan IVA）——该火箭是为发射原本计划从范登堡由航天飞机送入轨道的有效载荷而研制的。燃料：聚丁二烯丙烯腈（PBAN）。燃烧约 130 秒。
		//		UA1208
		#roUA1208Title = UA1208 固体火箭助推器
		#roUA1208Desc = UA1208 是 UA1207 的推测性 8 段版本。燃料：聚丁二烯丙烯腈（PBAN）。燃烧约 115 秒。
		//V
		//		Veronique
		#roVeroniqueTitle = Véronique 液体火箭发动机
		#roVeroniqueDesc = Véronique 于 20 世纪 40 年代末由法国 LRBA 研制（德法工程师共同参与），在德国瀑布（Wasserfall）防空导弹发动机技术基础上发展为同名探空火箭提供动力，是法国第一种高空探空火箭。燃料：硝酸/煤油（早期 N/NA 型）；燃料：硝酸/松节油（AGI 与 61 型）。燃烧约 32–55 秒（视型号）。
		//		Vexin
		#roVexinTitle = Vesta/Vexin/Valois 液体火箭发动机
		#roVexinDesc = Vexin 于 20 世纪 50–60 年代由法国 LRBA 作为"超级维罗妮卡"方案研制，是大型挤压式输送起飞发动机，为曾飞行的最大挤压式发动机之一。燃料（早期型）：发烟硝酸/松节油；燃料（Valois 及后期型）：偏二甲肼/四氧化二氮（UDMH/NTO）。用于维斯塔（Vesta）与"宝石"（Pierres Précieuses）系列探空火箭、钻石号（Diamant）一级（单台）及欧罗巴号（Europa）运载火箭二级，燃烧约 93 秒。
		//		VF-200
		#roVF200Title = VF-200 可变比冲磁等离子体火箭（VASIMR）
		#roVF200Desc = VF-200 由阿德·阿斯特拉火箭公司（Ad Astra Rocket Company）研制，基于为国际空间站（ISS）飞行构型验证而建造的实验室样机，是功率远超同期离子发动机的 VASIMR 磁等离子体火箭。燃料：氩（Argon）为主，亦可用氪（Krypton）等气体。需约 200 kW 电功率，设计用于长期连续工作。
		//		Vikas
		#roVikasTitle = Vikas 液体火箭发动机
		#roVikasDesc = Vikas 由印度空间研究组织（ISRO）于 20 世纪 70 年代引入法国 SEP 维金（Viking）发动机授权技术、80 年代完成国产化研制（1985 年首次试车，1993 年随 PSLV 首飞），是高推力自燃真空发动机。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。用于 PSLV 与 GSLV 的二级（各 1 台），PSLV 二级燃烧约 150 秒、GSLV 二级约 143 秒。
		//		Viking
		#roVikingTitle = Viking 液体火箭发动机
		#roVikingDesc = Viking 于 20 世纪 70 年代由法国欧洲推进协会（SEP）为欧洲阿丽亚娜（Ariane）运载火箭研制，是自燃推进剂起飞发动机，性能平平但可靠性出色。燃料：偏二甲肼/四氧化二氮（UDMH/NTO，后期改用 UH25）。既用作一级发动机，也加长喷管用作二级发动机，并为阿丽亚娜 4 的捆绑式液体助推器发展出专用型号；燃烧时长视型号约 125–207 秒。
		//		Viking (5/6)
		#roViking56Title = Viking（5/6）液体火箭发动机
		#roViking56Desc = Viking 5/6 是配备钟形喷管的实用型号，用于阿丽亚娜 1–4 的一级以及阿丽亚娜 4 的捆绑式液体助推器。燃料：偏二甲肼/四氧化二氮（UDMH/UH25）。阿丽亚娜 4 一级（L220）以 4 台并联，燃烧约 205 秒；PAL 捆绑式液体助推器各装 1 台，燃烧约 142 秒。
		//		Vulcain
		#roVulcainTitle = Vulcain 液体火箭发动机
		#roVulcainDesc = Vulcain 于 20 世纪 80–90 年代由法国斯奈克玛（Snecma）牵头欧洲多国为阿丽亚娜 5 研制，是燃气发生器循环液氧液氢主发动机，此前用于阿丽亚娜 5，现用于阿丽亚娜 6。燃料：液氧/液氢。用于阿丽亚娜 5 芯级（单台），燃烧约 605 秒（Vulcain 1）或约 540 秒（Vulcain 2）。
		//		VX-200
		#roVX200Title = VX-200SS 可变比冲磁等离子体火箭（VASIMR）
		#roVX200Desc = VX-200SS（稳态型）由阿德·阿斯特拉火箭公司（Ad Astra）研制，是该公司的第一台正式 VASIMR 发动机，为在宽广的比冲与推力范围内长期工作而设计。燃料：氩（Argon）为主，亦可用氪（Krypton）等多种气体工质。以 200 kW 功率与氩工质创造了比冲约 4900 秒、效率约 70% 的纪录，设计用于长期连续工作。
		//W
		//		Waxwing
		#roWaxwingTitle = Waxwing 固体火箭发动机
		#roWaxwingDesc = Waxwing 于 20 世纪 60 年代由英国火箭推进研究所（RPE Westcott）研制，是用于圆化轨道的固体变轨发动机。燃料：固体推进剂。用作黑箭（Black Arrow）运载火箭的第三级（1 台，1970–71 年），平均推力 29.4 kN，燃烧时长可靠消息暂无。
		//		Wasserfall
		#roWasserfallTitle = Wasserfall 液体火箭发动机
		#roWasserfallDesc = Wasserfall 起飞发动机于二战期间由德国为"瀑布"（Wasserfall）防空导弹研制，本质上是 A-4（V-2）的四分之一缩比，设计力求廉价并能快速发射。燃料：发烟硝酸/维斯醇（Visol）。采用简单的挤压式输送；导弹本身工作良好，但因当时技术无法研制出能准确拦截飞机的制导系统而失败。战后美、苏工程师均对其进行过试验，苏联工程师为其改进型（R-101）发展出改进版本，最终将其改装为弹道导弹，即 R-11（飞毛腿）。燃烧时长可靠消息暂无。
		//X
		//		X3
		#roX3Title = X3 霍尔效应推进器
		#roX3Desc = X3 由美国密歇根大学研制，是三通道大功率霍尔效应推进器，设计放电功率最高 250 kW，总效率超过 60%。燃料：氙（Xenon），比冲 1800–3500 秒；燃料：氪（Krypton），比冲最高 5000 秒。
		//		X405
		#roX405Title = X-405（XLR50-GE-2）液体火箭发动机
		#roX405Desc = X-405 于 20 世纪 50 年代由通用电气（General Electric）为先锋号（Vanguard）运载火箭一级研制，源自维京探空火箭的 XLR10 发动机，是最早的液氧煤油燃气发生器循环起飞发动机之一。燃料：液氧/煤油（RP-1）。用于先锋号一级（单台），燃烧约 145 秒。
		//		XIPS_25cm
		#roXIPS_25cmTitle = XIPS-25 栅极离子推进器
		#roXIPS_25cmDesc = XIPS-25（氙离子推进系统，25 厘米）由美国 L-3 技术公司（L-3 Technologies）于 20 世纪 90 年代研制，是用于商业通信卫星位置保持的小型栅极离子推进器。燃料：氙（Xenon）。用于波音 601 与 702 卫星平台的位置保持，质功比 3.56 kg/kW，设计用于长期连续工作。
		//		XLR10
		#roXLR10Title = XLR10 液体火箭发动机
		#roXLR10Desc = XLR10 由反应发动机公司（Reaction Motors）于 20 世纪 40 年代末为维京（Viking）探空火箭研制，用于替代 V-2 开展高空研究，是当时美国最大的液体火箭发动机之一。燃料：液氧/乙醇。用于维京探空火箭（单台），早期型号燃烧约 70 秒，RTV-N-12a 改型燃烧约 103 秒；其改进型 XLR50（X-405）成为先锋号运载火箭的一级发动机。
		//		XLR11
		#roXLR11Title = XLR11 液体火箭发动机
		#roXLR11Desc = XLR11 由反应发动机公司（Reaction Motors）于 20 世纪 40 年代为贝尔 X-1 突破音障研制，是第一种用于飞机的美国液体火箭发动机，后长期用于多种试验机。燃料：液氧/75% 乙醇（含 25% 水）。四个燃烧室可独立点火，以离散档位近似节流（不能连续调节），用于 X-1、早期 X-15、X-24B 与 D-558-2 等，燃烧时长可靠消息暂无。
		//		XLR25
		#roXLR25Title = XLR25 液体火箭发动机
		#roXLR25Desc = XLR25 于 20 世纪 40 年代末为 X-2 试验机研制，用于探索比 X-1 更高的速度与高度，是美国第一种可连续节流的火箭发动机。燃料：液氧/乙醇。发动机本身取得成功，但 X-2 在高速下极不稳定，仅进行了少量飞行，燃烧时长可靠消息暂无。
		//		XLR40
		#roXLR40Title = XLR40 液体火箭发动机
		#roXLR40Desc = XLR40 于 20 世纪 50 年代研制，是小型液体火箭发动机，原计划安装于 XF8U-3 战斗机以提升性能。燃料：可靠消息暂无。原型机在试验中爆炸，XF8U-3 又败于 F4H 而取消，项目随之终止，燃烧时长可靠消息暂无。
		//		XLR41
		#roXLR41Title = XLR41 液体火箭发动机
		#roXLR41Desc = XLR41 是 V-2（A-4）Model 39 发动机的美国化版本，与原型非常相似，但采用美制 SAE 标准零部件取代公制零件，并含有多处小幅改进。燃料：液氧/75% 乙醇。用于 Hermes 计划的试验飞行，燃烧时长可靠消息暂无。
		//		XLR99
		#roXLR99Title = XLR99 液体火箭发动机
		#roXLR99Desc = XLR99 由反应发动机公司（Reaction Motors，塞奥科化学公司分部）于 20 世纪 50 年代末为 X-15 空天飞机研制，是第一种大型可节流、可再点火的载人火箭发动机。燃料：液氧/无水氨。节流范围 50%–100%，可多次再点火；X-15 基本型贮箱可供全推力约 83 秒，X-15A-2 带外挂贮箱超过 150 秒。
		//		XLR132
		#roXLR132Title = XLR-132 液体火箭发动机
		#roXLR132Desc = XLR-132 于 1983 年由洛克达因（Rocketdyne）研制，是泵压式高性能上面级发动机，原计划用于近地点/远地点变轨级、轨道转移飞行器以及月球与火星任务。燃料：一甲基肼/四氧化二氮（MMH/NTO）。经大量试车但从未投入飞行，可点火 10 次，按燃料可支持的总燃烧时长约 4000 秒。
		//		XRS2200
		#roXRS2200Title = XRS-2200 液体火箭发动机
		#roXRS2200Desc = XRS-2200 由洛克达因（Rocketdyne）于 20 世纪 90 年代为 NASA 的 X-33 缩比单级入轨技术验证机研制，是线性气尖（aerospike）发动机，与环形气尖的 J-2T 一样沿用 J-2S 的涡轮泵等成熟部件。燃料：液氧/液氢。随 X-33 项目取消而终止，未投入飞行，燃烧时长可靠消息暂无。
		//Y
		//		YF1
		#roYF1Title = YF-1 液体火箭发动机
		#roYF1Desc = YF-1 于 20 世纪 60 年代由中国为东风-3 弹道导弹研制，源自伊萨耶夫（Isayev）为"暴风"（Burya）巡航导弹研制的 S2.1100 起飞发动机，是自燃推进剂燃气发生器循环起飞发动机。燃料：偏二甲肼/红发烟硝酸（UDMH/IRFNA）。四台 YF-1 组成 YF-2 起飞发动机，用于东风-3、东风-4 与长征一号一级，燃烧时长可靠消息暂无。
		//		YF3
		#roYF3Title = YF-3 液体火箭发动机
		#roYF3Desc = YF-3 于 20 世纪 60 年代由中国研制，源自伊萨耶夫（Isayev）为"暴风"（Burya）巡航导弹研制的 S2.1100 起飞发动机，是自燃推进剂燃气发生器循环真空发动机。燃料：偏二甲肼/红发烟硝酸（UDMH/IRFNA）。作为真空型号用于东风-4 与长征一号二级，燃烧时长可靠消息暂无。
		//		YF20
		#roYF20Title = YF-20 液体火箭发动机
		#roYF20Desc = YF-20 于 20 世纪 60 年代中期由中国为东风-5 弹道导弹研制，是自燃推进剂燃气发生器循环起飞发动机。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。四台 YF-20 组成 YF-21 起飞发动机，用于东风-5、风暴一号（FB-1）与长征二号/三号/四号一级，以及长征二号/三号的捆绑式助推器，燃烧约 140 秒。
		//		YF22
		#roYF22Title = YF-22 液体火箭发动机
		#roYF22Desc = YF-22 于 20 世纪 60 年代中期由中国为东风-5 弹道导弹研制，是自燃推进剂燃气发生器循环真空发动机。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。它与 YF-23 游动发动机组成 YF-24 发动机组合，用于东风-5、风暴一号（FB-1）与长征二号/三号/四号二级，燃烧时长可靠消息暂无。
		//		YF23
		//		YF24
		#roYF23Title = YF-24 液体火箭发动机
		#roYF23Desc = YF-24 于 20 世纪 60 年代中期由中国为东风-5 弹道导弹研制，是带游动发动机的自燃推进剂燃气发生器循环真空发动机。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。它由一台 YF-22 与 YF-23 游动发动机构成，用于东风-5、风暴一号（FB-1）与长征二号/三号/四号二级，燃烧时长可靠消息暂无。
		//		YF40
		#roYF40Title = YF-40 液体火箭发动机
		#roYF40Desc = YF-40 于 20 世纪 70 年代由中国为长征四号第三级研制，是自燃推进剂燃气发生器循环真空发动机。燃料：偏二甲肼/四氧化二氮（UDMH/NTO）。用于长征四号第三级，后期型号具备再点火能力，燃烧时长可靠消息暂无。
		//		YF73
		#roYF73Title = YF-73 液体火箭发动机
		#roYF73Desc = YF-73 于 20 世纪 70 年代由中国研制，是中国首款投入使用的液氧/液氢燃气发生器循环真空发动机。燃料：液氧/液氢。用于长征三号第三级（分两次点火），总燃烧时长约 750 秒；性能较低且可靠性欠佳，13 次飞行后被 YF-75 取代。
		//		YF75
		#roYF75Title = YF-75 液体火箭发动机
		#roYF75Desc = YF-75 是中国为取代 YF-73 而研制的液氧/液氢燃气发生器循环真空发动机，于 20 世纪 80 年代开始研制，1994 年随长征三号甲首飞投入使用。燃料：液氧/液氢。用于长征三号甲/乙/丙第三级（2 台）；其膨胀循环改型 YF-75D 用于长征五号二级（2 台），燃烧时长可靠消息暂无。
		//		YF77
		#roYF77Title = YF-77 液体火箭发动机
		#roYF77Desc = YF-77 于 2001 年由中国立项研制，是液氧/液氢燃气发生器循环主发动机。燃料：液氧/液氢。用于长征五号一级（2 台），2016 年随长征五号首飞，燃烧时长可靠消息暂无。
		//		YF100
		#roYF100Title = YF-100 液体火箭发动机
		#roYF100Desc = YF-100 于 21 世纪初由中国研制，基于 RD-120，是中国研制的首款分级燃烧循环液氧/煤油起飞发动机。燃料：液氧/煤油（RP-1）。用于长征五号的捆绑式助推器，以及长征六号、七号、八号的助推器与一级，燃烧时长可靠消息暂无。
		
		//	============================================================================
		//	Jet Engine Config Localizations
		//	============================================================================
		//		A136
		#roA136Title = A-136 核动力涡轮冲压发动机
		#roA136Desc = A-136 于 20 世纪 60 年代初由美国为超声速轰炸机研制，是飞机核推进（ANP）计划产生的终极直接循环设计之一。它采用混合循环改善超声速性能：分流少量空气冷却涡轮以控制涡轮进口温度，其余空气直接穿过反应堆加热至全温，使发动机在马赫 3 以下性能良好；另设煤油燃烧室以改善起飞推力。燃料：航空煤油（起飞段）/核能加热空气（冲压巡航段）。温度限制可靠消息暂无。
		//		AL-7
		#roAL7Title = AL-7 涡喷发动机
		#roAL7Desc = AL-7 是 20 世纪 50 年代初的涡喷发动机，曾作为苏-7、苏-9、苏-11、图-128 与别-10 水上飞机的动力装置。燃料：航空煤油。温度限制可靠消息暂无。
		//		AL-31
		#roAL31Title = AL-31 低涵道比涡扇发动机
		#roAL31Desc = AL-31 是 20 世纪 80 年代初的低涵道比涡扇发动机，为苏-27 研制。尽管研制过程艰难（早期苏-27 曾装备 AL-21），最终大获成功，装备苏-27、苏-30、苏-34、苏-35、苏-57、歼-10 与歼-11；后期型号还具备推力矢量能力。现代化改进型命名为 AL-41F-1，勿与 20 世纪 80 年代末的另一款 AL-41 混淆。燃料：航空煤油。温度限制可靠消息暂无。
		//		Atar 09
		#roAtar09Title = Atar 09 涡喷发动机
		#roAtar09Desc = Atar 08/09 是 20 世纪 50 年代末对 Atar 101 的重新设计，增大了推力（Atar 08）并加装加力燃烧室（Atar 09）。Atar 09 装备了法国下一代喷气式飞机，包括猎豹（Cheetah）C/D/E/R、幻影 III/IV 与幻影 F1。燃料：航空煤油。温度限制可靠消息暂无。
		//		Atar 101
		#roAtar101Title = Atar 101 涡喷发动机
		#roAtar101Desc = Atar 101 是二战后法国最早研制的喷气发动机之一，曾装备 Vautour I/II、Gerfaut I 与神秘 II 等多种早期法国喷气式飞机。燃料：航空煤油。温度限制可靠消息暂无。
		//		Avon
		#roAvonTitle = Avon 涡喷发动机
		#roAvonDesc = Avon 是罗尔斯·罗伊斯（Rolls-Royce）首台轴流式涡喷发动机，于 1950 年问世，装备了 20 世纪 50、60 年代大部分英国飞机，包括海雌狐、堪培拉、闪电、猎人、雨燕与勇士。燃料：航空煤油。温度限制可靠消息暂无。
		//		CF6
		#roCF6Title = CF6 高涵道比涡扇发动机
		#roCF6Desc = CF6 由通用电气（General Electric）基于首台投入量产的高涵道比涡扇发动机 TF39 研制，20 世纪 70 年代初投入使用，装备了 A300、A310、A330、波音 747、波音 767、DC-10、KC-10、MD-11、E-4、C-2 与 C-5M 等众多大型飞机。燃料：航空煤油。温度限制可靠消息暂无。
		//		CF34
		#roCF34Title = TF/CF34 高涵道比涡扇发动机
		#roCF34Desc = TF34 是 20 世纪 70 年代的高涵道比涡扇发动机，装备 S-3、S-72 与 A-10；其民用改型 CF34 则装备挑战者（Challenger）600 系列、挑战者 850、CRJ100/200/440/700/900 与 Embraer 170/175/190/195 等众多大型公务机与支线客机。燃料：航空煤油。温度限制可靠消息暂无。
		//		CFM56
		#roCFM56Title = CFM56 高涵道比涡扇发动机
		#roCFM56Desc = CFM56 是 20 世纪 70 年代基于 F101 研制的高涵道比涡扇发动机，由通用电气（GE）与斯奈克玛（Snecma）合作研制，是有史以来最成功的高涵道比涡扇发动机，产量超过 3 万台。它装备空客 A320 与 A340 系列、波音 737 经典/新一代系列、DC-8-70，并用于 E-3、E-6 与 KC/RC-135 等大量 707 系飞机的换发。燃料：航空煤油。温度限制可靠消息暂无。
		//		Chimera
		#roChimeraTitle = Chimera 组合循环冲压发动机
		#roChimeraDesc = Chimera 由美国 Hermeus 公司于 21 世纪 20 年代初研制，是以退役 J85 发动机为核心机的组合循环冲压发动机技术验证机，设计飞行包线覆盖马赫 0 至马赫 5。燃料：航空煤油。温度限制可靠消息暂无。
		//		D-18
		#roD18Title = D-18 高涵道比涡扇发动机
		#roD18Desc = D-18 是苏联研制的最大型高涵道比涡扇发动机，于 20 世纪 80 年代为安-124 与安-225 研制。燃料：航空煤油。温度限制可靠消息暂无。
		//		D-30
		#roD30Title = D-30 低涵道比涡扇发动机
		#roD30Desc = D-30 于 20 世纪 60 年代初研制，是苏联最早研制的涡扇发动机之一，也是最成功的一款。它最初为图-134 客机研制，后装备图-154、伊尔-62、伊尔-76、M-55 等众多苏联飞机，加力型还用于米格-31 与苏-47。燃料：航空煤油。温度限制可靠消息暂无。
		//		Derwent
		#roDerwentTitle = Derwent 涡喷发动机
		#roDerwentDesc = 德文特（Derwent）是 W.2/威兰（Welland）发动机的直流式发展型号，相比"回流"布局提升了推力与效率。该系列寿命短暂，止于二战结束；事实上德文特 V 是一台缩小的尼恩（Nene）。它装备流星（Meteor）F.3/F.4/NF.12/NF.14、Nord 1601 与 Sagittario II，其许可证仿制型 RD-500 则用于雅克-23/25/30 与拉-15。燃料：航空煤油。温度限制可靠消息暂无。
		//		DS215
		#roDS215Title = DS-215 电动涵道风扇
		#roDS215Desc = DS-215 是大型 16 kW 电动涵道风扇，同尺寸下功率十分强劲，但固定桨距的叶片使其仅适用于低速飞行。动力：电力（无燃料）。温度限制可靠消息暂无。
		//		EJ200
		#roEJ200Title = EJ200 低涵道比涡扇发动机
		#roEJ200Desc = EJ200 是 20 世纪 90 年代由多家欧洲公司联合研制的低涵道比涡扇发动机，为欧洲战斗机"台风"（Eurofighter Typhoon）研制。燃料：航空煤油。温度限制可靠消息暂无。
		//		F100
		#roF100Title = F100 低涵道比涡扇发动机
		#roF100Desc = F100 是 20 世纪 70 年代为 F-15 与 F-16 研制的低涵道比涡扇发动机，其先进设计与强劲动力使 F-15、F-16 的推重比超过 1，装备全部 F-15 与大多数 F-16 型号。燃料：航空煤油。受温度限制，最高工作马赫 2.85。
		//		F119
		#roF119Title = F119 低涵道比涡扇发动机
		#roF119Desc = F119 是 20 世纪 90 年代为"先进战术战斗机"（ATF）计划研制的低涵道比涡扇发动机。为实现超声速巡航设计，其干推力对尺寸而言异常强劲，并采用二维推力矢量喷管提升机动性，装备 F-22、YF-23、X-32 与 X-35。燃料：航空煤油。受温度限制，最高工作马赫 2.55。
		//		F135
		#roF135Title = F135 低涵道比涡扇发动机
		#roF135Desc = F135 是 21 世纪初为 F-35 研制的低涵道比涡扇发动机，有两种型号：常规喷管型用于 F-35A/C，前向动力输出轴（PTO）加可偏转喷管型用于具备垂直起降能力的 F-35B。燃料：航空煤油。温度限制可靠消息暂无。
		//		F404
		#roF404Title = F404 低涵道比涡扇发动机
		#roF404Desc = F404 是 20 世纪 70 年代为 F/A-18 研制的低涵道比涡扇发动机，设计以可靠性为先、性能次之，以替换当时美国海军与海军陆战队以可靠性差著称的 F-4 与 F-14 发动机。它装备 F/A-18A/B/C/D、F-20A、F-117A、T-7A、T-50、JAS-39 与 Tejas。燃料：航空煤油。温度限制可靠消息暂无。
		//		GE4
		#roGE4Title = GE4 涡喷发动机
		#roGE4Desc = GE4 是 20 世纪 70 年代为波音 2707 超声速运输机研制的涡喷发动机，设计速度最高马赫 2.7，是有史以来最强大的涡喷发动机。它虽经大量试验，最终仍随 2707 项目一同取消。燃料：航空煤油。温度限制可靠消息暂无。
		//		GEnx
		#roGEnxTitle = GEnx 高涵道比涡扇发动机
		#roGEnxDesc = GEnx 是 21 世纪初基于 GE90 研制的大型高涵道比涡扇发动机，为波音 787 设计，用于大多数 787 型号以及 747-8。燃料：航空煤油。温度限制可靠消息暂无。
		//		J35
		#roJ35Title = J35 涡喷发动机
		#roJ35Desc = J35 由艾里逊/通用电气（Allison/General Electric）研制，是轴流式涡喷发动机，也是美国最早自行设计的涡喷发动机之一。虽然知名度不及其后继型号 J47，它仍装备了 FJ-1、F-84、F-89、XP-86、XB-45、XB-47、X-5 与 D-558 等众多 40 年代末期飞机。燃料：航空煤油。温度限制可靠消息暂无。
		//		J47
		#roJ47Title = J47 涡喷发动机
		#roJ47Desc = J47 是 20 世纪 50 年代初由通用电气（General Electric）在 J35 基础上研制的涡喷发动机，装备 F-86、FJ-2、B-36、B-45 与 B-48。燃料：航空煤油。温度限制可靠消息暂无。
		//		J48
		#roJ48Title = J48/Tay 涡喷发动机
		#roJ48Desc = J48 由美国普惠公司于 20 世纪 40 年代末研制，本质上是放大的罗尔斯·罗伊斯"尼恩"（Nene）——罗尔斯·罗伊斯为发展"埃文"（Avon）而放弃了"泰"（Tay），普惠收购该设计后以 J48 之名投产。燃料：航空煤油。装备 F9F-5 黑豹、F9F-6/8 美洲狮、F-94C 星火与 YF-93，1950 年可用。
		//		J57
		#roJ57Title = J57 涡喷发动机
		#roJ57Desc = J57 由美国普惠公司于 20 世纪 50 年代初研制，是 50 年代美国的主力涡喷发动机，为众多飞机提供动力。燃料：航空煤油。装备 B-52、大部分世纪系列战斗机以及 U-2，1953 年可用。
		//		J58
		#roJ58Title = J58 涡喷发动机
		#roJ58Desc = J58 于 20 世纪 50 年代末由美国普惠公司设计，为 3 马赫以上飞行而重新设计定位，是 A-12/SR-71A/B/YF-12A 的动力，民用编号为 JT11。燃料：航空煤油。1962 年随 A-12 投入使用。
		//		J75
		#roJ75Title = J75 涡喷发动机
		#roJ75Desc = J75 由美国普惠公司于 20 世纪 50 年代中期研制，本质上是放大版的 J57，军用民用皆应用广泛。燃料：航空煤油。装备 F-105、F-106、F-107、XF8U-3、A-12、U-2 与 P6M，并以 JT4A 之名用于波音 707 与 DC-8，1956 年可用。
		//		J79
		#roJ79Title = J79 涡喷发动机
		#roJ79Desc = J79 由美国通用电气公司于 20 世纪 50 年代研制，是美国第一台"2 马赫"级涡喷发动机，服役范围广泛。燃料：航空煤油。装备 B-58、F-4、A-5 与 F-104，1958 年可用。
		//		J85
		#roJ85Title = J85 涡喷发动机
		#roJ85Desc = J85 由美国通用电气公司于 20 世纪 50 年代研制，最初作为小型消耗性喷气发动机用于诱饵与无人机，后经升级用于有人驾驶飞机。燃料：航空煤油。装备 F-5、CF-5、G.91Y、T-2、T-38 与 A-37 等众多小型飞机，1959 年可用。
		//		J93
		#roJ93Title = J93 涡喷发动机
		#roJ93Desc = J93 由美国通用电气公司在 J79 基础上研制，为 3 马赫级飞行设计，用于 B-70 与 F-108。燃料：航空煤油。XB-70 验证机于 1964 年首飞，随项目终止，发动机未批量服役。
		//		JT8D
		#roJT8DTitle = JT8D 低涵道比涡扇发动机
		#roJT8DDesc = JT8D 由美国普惠公司于 20 世纪 60 年代在 J52 基础上研制，是早期低涵道比涡扇发动机，用于波音 727、737 与 DC-9 等众多第二代喷气客机。燃料：航空煤油。1970 年代的深度改型 JT8D-200 系列装备 Super 27 与 MD-80 系列，并用于升级 E-8C 等众多基于 707 的飞机，1964 年可用。
		//		Model 304
		#roModel304Title = Model 304 涡喷发动机
		#roModel304Desc = Model 304-2 于 20 世纪 50 年代末由美国普惠公司基于 J57 研制，是燃用液氢的涡喷发动机，为 SUNTAN 计划设计，旨在取代 U-2 侦察机。燃料：液氢。该计划需发展大规模液氢生产与处理技术，耗资数亿美元，试验中表现出惊人的稳定性与效率；但常规燃料的 A-12/SR-71 前景更好，项目最终取消，未投入飞行，其技术与人员随后转入 RL-10 的研制。
		//		NK-8
		#roNK8Title = NK-8 低涵道比涡扇发动机
		#roNK8Desc = NK-8 由苏联库兹涅佐夫设计局于 20 世纪 60 年代研制，为伊尔-62 与图-154 客机提供动力。燃料：航空煤油。后经改进提升性能用于伊尔-86，并为图-155 试验项目改装燃用替代燃料，装备 A-90、伊尔-62、伊尔-62M、图-154、图-154A/B 与图-155，1963 年可用。
		//		NK-12
		#roNK12Title = NK-12 涡桨发动机
		#roNK12Desc = NK-12 由苏联库兹涅佐夫设计局于 20 世纪 50 年代为图-95 研制，是投入量产的最大的涡桨发动机。燃料：航空煤油。装备 A-90、安-22、图-95、图-114、图-116、图-126 与图-142，1956 年可用。
		//		NK-22/144
		#roNK22Title = NK-22/144 低涵道比涡扇发动机
		#roNK22Desc = NK-144 由苏联库兹涅佐夫设计局于 20 世纪 60 年代在 NK-8 基础上研制，为图-144 超音速客机提供动力。燃料：航空煤油。因未达到性能要求而被 RD-36 取代，但以 NK-22 之名重获新生，装备图-22M0/M1/M2，1968 年可用。
		//		NK-25/32
		#roNK25Title = NK-25/32 低涵道比涡扇发动机
		#roNK25Desc = NK-25 由苏联库兹涅佐夫设计局于 20 世纪 70 年代在 NK-22 基础上研制，是有史以来飞行的最强大的超音速喷气发动机。燃料：航空煤油。装备图-22M3、图-160、图-160M 与图-144LL，1977 年可用。
		//		Nord 1500
		#roNord1500Title = Nord 1500/Atar 组合循环冲压发动机
		#roNord1500Desc = Nord 1500 由法国北方航空公司于 20 世纪 50 年代研制，是与阿塔（Atar）101E 涡喷发动机组合的组合循环冲压发动机，用于格列芬 II（Griffon II）试验机。燃料：航空煤油。阿塔 101 将飞机加速至音速后由冲压发动机接力，可将速度推至 2 马赫以上；格列芬 II 虽表现良好，仍因更常规的方案胜出而于 1957 年取消。
		//		Olympus 593
		#roOlympus593Title = Olympus 593 涡喷发动机
		#roOlympus593Desc = Olympus 593 由英国罗尔斯·罗伊斯与法国斯奈克玛于 20 世纪 60 年代末联合研制，是奥林巴斯涡喷系列的终极型号，专为持续 2 马赫飞行设计，为协和（Concorde）客机提供动力。燃料：航空煤油。海平面耗油偏高，但搭配优化进气道可在 2 马赫下超巡，效率相对较好，1976 年可用。
		//		PT6A
		#roPT6ATitle = PT6A 涡桨发动机
		#roPT6ADesc = PT6A 由加拿大普惠公司于 20 世纪 60 年代初研制，是小型涡桨发动机，最初用于比奇"空中国王"（King Air）。燃料：航空煤油。凭借低成本、轻重量与高可靠性，成为史上最成功的涡桨发动机之一，产量超过 60,000 台，广泛用于各类通用航空与小型商用飞机，并常作为老式活塞飞机的升级动力，1964 年可用。
		//		R-11
		#roR11Title = R-11 涡喷发动机
		#roR11Desc = R-11 由苏联图曼斯基设计局于 20 世纪 50 年代末研制，与较简单的 RD-9 并行发展，成为米格-21、雅克-28 与苏-15 的动力。燃料：航空煤油。中国逆向仿制为涡喷-7（WP-7），装备歼教-7、歼-7/F-7 与歼-8，1959 年可用。
		//		R-13
		#roR13Title = R-13 涡喷发动机
		#roR13Desc = R-13 由苏联图曼斯基设计局于 20 世纪 60 年代末在 R-11 基础上研制，用于提升米格-21 的性能，成为后期型米格-21 与苏-15 的动力。燃料：航空煤油。中国逆向仿制为涡喷-13（WP-13），装备歼-7III 及其后型号与歼-8II，1966 年可用。
		//		R-15
		#roR15Title = R-15 涡喷发动机
		#roR15Desc = R-15 由苏联图曼斯基设计局于 20 世纪 50 年代末为图-121 巡航导弹研制，后改装用于米格-25，使其成为量产最快的战斗机，可飞至 3.2 马赫，但伴随发动机严重损伤的风险。燃料：航空煤油。1969 年随米格-25 服役。
		//		R-25
		#roR25Title = R-25 涡喷发动机
		#roR25Desc = R-25 由苏联图曼斯基设计局于 20 世纪 60 年代末研制，用于取代 R-11 与 R-13，配装极其强劲的"超功率"加力燃烧室，可在短时间内使推力近乎翻倍。燃料：航空煤油。装备米格-21bis 等后期型米格-21，1972 年可用。
		//		R-79
		#roR79Title = R-79 涡扇发动机
		#roR79Desc = R-79 由苏联留里卡设计局于 20 世纪 80 年代为雅克-41 研制，是带加力的涡扇发动机，喷管可偏转 95 度以支持垂直起降，也是同类中首台配装加力燃烧室的型号，使雅克-41 具备超音速飞行能力。燃料：航空煤油。装备雅克-141/41，还曾提议在去除推力矢量系统后用于苏-47，1987 年可用。
		//		RB162
		#roRB162Title = RB.162 涡喷发动机
		#roRB162x2Title = 2×RB.162 涡喷发动机
		#roRB162Desc = RB.162 由英国罗尔斯·罗伊斯于 20 世纪 60 年代研制，是为垂直起降飞机设计的轻型升力涡喷发动机，大量使用玻璃纤维与塑料以极限减重，寿命短但推重比极高。燃料：航空煤油。用作 Do-31、幻影 IIIV 与 VAK 191B 的升力发动机，并作为三叉戟 3B 的起飞助推发动机，1965 年可用。
		//		RD-9
		#roRD9Title = RD-9 涡喷发动机
		#roRD9Desc = RD-9 由苏联图曼斯基设计局于 20 世纪 50 年代初研制，是米库林 AM-3 的缩小版，专为战斗机设计，装备雅克-25/26/27/28 与米格-19。燃料：航空煤油。中国获许可仿制为涡喷-6（WP-6），装备歼教-6、歼-6/F-6、强-5 与歼-12，1955 年可用。
		//		RD-36
		#roRD36Title = RD-36 涡喷发动机
		#roRD36Desc = RD-36-51 由苏联科列索夫设计局于 20 世纪 70 年代研制，为图-144 提供动力，取代性能不佳的 NK-144，使图-144 达到设计航程。燃料：航空煤油。装备图-144D 与 M-17；图-144 因成本问题升级后不久即退出客运，1974 年可用。
		//		RD-41
		#roRD41Title = RD-41 涡喷发动机
		#roRD41x2Title = 2×RD-41 涡喷发动机
		#roRD41Desc = RD-41 由苏联科列索夫设计局于 20 世纪 80 年代研制，是 RD-36 升力涡喷发动机的改进型，用于雅克-141/41M，采用可摆动安装座、偏转 12.5 度以改善悬停稳定性。燃料：航空煤油。用作雅克-141/41M 的升力发动机，1987 年可用。
		//		RD-012
		#roRD012Title = RD-012 冲压发动机
		#roRD012Desc = RD-012 由苏联研制，是超音速冲压发动机，为拉-350"暴风"（Burya）巡航导弹提供动力，最高速度可达 3.1 马赫。燃料：航空煤油。1957 年可用。
		//		RJ43
		#roRJ43Title = RJ43 冲压发动机
		#roRJ43Desc = RJ43 由美国马夸特公司研制，是超音速冲压发动机，为 CIM-10 波马克（Bomarc）地空导弹提供动力，速度可达 3 马赫。燃料：航空煤油。亦用于 X-7 与 XQ-5/AQM-60 靶机，并改装用于 D-21 无人机，速度超过 3.3 马赫，1959 年可用。
		//		RJ47
		#roRJ47Title = RJ47 冲压发动机
		#roRJ47Desc = RJ47 由美国马夸特公司研制，是超音速冲压发动机，为 SM-64 纳瓦霍（Navaho）巡航导弹提供动力，最高速度 2.75 马赫。燃料：航空煤油。1956 年可用。
		//		RJ55
		#roRJ55Title = RJ55/J67 组合循环冲压发动机
		#roRJ55Desc = RJ55 由美国马夸特公司研制，是与 J67 涡喷发动机组合的组合循环冲压发动机，为 XF-103 截击机设计。燃料：航空煤油。低速时 RJ55 充当 J67 的加力燃烧室，2.24 马赫时涡喷关机、由 RJ55 将飞机推至 3 马赫；因 J67 涡喷发动机研制困难，原型机从未以自身动力飞行。
		//		RJ59
		#roRJ59Title = RJ59 冲压发动机
		#roRJ59Desc = RJ59 由美国马夸特公司研制，是超音速冲压发动机，为康维尔"超级盗贼"（Super Hustler）轰炸机方案设计。燃料：航空煤油。超级盗贼虽被取消，RJ59 仍装于 X-7 试验机进行测试，1961 年达到 4 马赫以上。
		//		Sapphire
		#roSapphireTitle = Sapphire 涡喷发动机
		#roSapphireDesc = Sapphire 由英国阿姆斯特朗·西德利于 20 世纪 50 年代初研制，源自英国首台轴流式喷气发动机 MetroVick F.2。燃料：航空煤油。装备霍克"猎人"、汉德利·佩奇"胜利者"与格洛斯特"标枪"，1954 年可用。
		//		VK-1
		#roVK1Title = VK-1 涡喷发动机
		#roVK1Desc = VK-1 由苏联克里莫夫设计局于 20 世纪 40 年代末研制，是罗尔斯·罗伊斯"尼恩"（Nene）的苏联改进型，用于众多早期苏联喷气飞机。燃料：航空煤油。装备米格-15、米格-17、图-14 与伊尔-28，1950 年可用。
		//		Welland
		#roWellandTitle = Welland 涡喷发动机
		#roWellandDesc = Welland 由英国罗尔斯·罗伊斯于 20 世纪 40 年代初研制，源自弗兰克·惠特尔的原始喷气发动机 W.1，是罗尔斯·罗伊斯首台投入生产的涡喷发动机。燃料：航空煤油。装备流星（Meteor）F.1，后被更强劲的发动机迅速取代，1944 年可用。
		//		WS-10
		#roWS10Title = WS-10 低涵道比涡扇发动机
		#roWS10Desc = WS-10（涡扇-10"太行"）由中国沈阳发动机设计研究所研制，是首款成功的国产低涵道比加力涡扇发动机，源自试验性的涡扇-6（WS-6），用于取代部分中国飞机上使用的俄制 AL-31。燃料：航空煤油。装备歼-8II、歼-10B/C、歼-11B、歼-15、歼-16 与歼-20/A，2006 年定型。
	}
}
